<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>OVERDRAFT — your health bar is the magazine</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#04050a" />
<!-- iOS ignores manifest orientation, so these are what actually make a
     home-screen icon launch fullscreen and landscape on an iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OVERDRAFT" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<meta name="description" content="OVERDRAFT is a top-down arena shooter where every bullet is paid for with your own health. Kill to earn it back." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060a;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; touch-action: none; outline: none;
    image-rendering: auto;
    max-width: 100%; max-height: 100%;
  }
  /* CRT scanlines + soft edge vignette over the whole stage */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode: multiply;
    opacity: .75;
  }
  #credit {
    position: fixed; bottom: 6px; right: 10px; z-index: 11;
    font-size: 10px; letter-spacing: .12em; color: #3a4152; pointer-events: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
  <div id="crt"></div>
  <div id="credit">OVERDRAFT · vertical slice · made with AI</div>
  <script>
(() => {
'use strict';
const __sim = (() => {

// OVERDRAFT — pure simulation. No DOM, no canvas, no audio.
// Runs identically in the browser and in Node (used by the headless balance tests).
//
// CORE RULE: your health bar IS your magazine.
//   - Every shot spends 1 PULSE.
//   - Taking a hit spends 2-3 PULSE and knocks you back.
//   - Every kill refunds PULSE (more than a kill costs you, if you don't miss).
//   - At 0 PULSE you enter OVERDRAFT: you may keep firing on credit down to -3.
//   - In overdraft a kill refunds 1.5x. You are always one bad hit from death.
// So: accuracy is survival. Missing is the only way to lose health for free.

// Default world is landscape; setWorld() reshapes it (portrait phones, etc.)
const W = 1280;
const H = 720;
const MIN_W = 320;
const MIN_H = 480;
// reference size the gameplay numbers were tuned against
const REF_MIN = 720;
const MAX_PULSE = 8;
const OVERDRAFT_FLOOR = -3;
const STEP = 1 / 60;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

const ENEMY_TYPES = {
  scrapper: { r: 13, hp: 1, speed: 108, dmg: 2, refund: 2, score: 100, color: '#ff5f6d' },
  drifter:  { r: 17, hp: 2, speed: 76,  dmg: 2, refund: 2, score: 150, color: '#ffa14a' },
  lancer:   { r: 15, hp: 2, speed: 58,  dmg: 1, refund: 2, score: 200, color: '#c46bff' },
  brute:    { r: 30, hp: 6, speed: 52,  dmg: 3, refund: 4, score: 400, color: '#ff2d55' },
};

// The two modes are not a difficulty slider. They change the rules:
//
//   MANUAL (marksman) - you aim. Shots cost 1 PULSE, kills refund 2, and a shot
//     that hits nothing ricochets off the wall and comes back at you. Precision
//     is the whole game: accuracy IS your ammo supply.
//
//   AUTO (turret)     - the gun aims and fires itself at the nearest target.
//     You only position and dash. Shots still cost PULSE but kills refund less,
//     and misses do NOT ricochet (the turret rarely misses). The economy is
//     tighter and there is no precision to save you, so RUNNING OUT is the real
//     threat. You are managing a budget, not an aim.
const FIRE_MODES = {
  manual: {
    id: 'manual', name: 'MARKSMAN', blurb: 'You aim. Misses ricochet back at you.',
    // accurate play is genuinely harder here, so a hit pays more
    cost: 1, refund: 3, ricochet: true, fireRate: 0.16, autoAim: false, autoFire: false, assist: true,
  },
  assisted: {
    // the middle road the user asked for: the gun finds the target, you keep the
    // trigger. Aiming anxiety gone, ammo decisions still yours.
    id: 'assisted', name: 'AUTO-AIM', blurb: 'Gun aims itself. You still pull the trigger.',
    cost: 1, refund: 2, ricochet: true, fireRate: 0.20, autoAim: true, autoFire: false, assist: false,
  },
  auto: {
    id: 'auto', name: 'TURRET', blurb: 'Aims AND fires. You position and dash.',
    // auto-fire cannot be aimed, so it pays on refunds instead of per shot
    cost: 1, refund: 1, ricochet: false, fireRate: 0.26, autoAim: true, autoFire: true, assist: false,
  },
};

// ---------------------------------------------------------------------------
// LEVELS
//
// A level is a fixed-length fight with a clear win condition: kill the quota
// before the clock runs out. Clear it and you pick an augment and get a breather.
// Fail and you keep the PULSE you have and try the same level again — you are
// never sent backwards, so the run never stalls.
//
// Each level introduces one idea, then the next one builds on it. The player is
// supposed to finish a level and be able to say in one sentence what it was
// about, which is why every entry has a `teach` line surfaced on the card.
//
//   time      seconds on the clock
//   quota     kills required to clear
//   kinds     enemy types that may spawn
//   spawn     seconds between spawn attempts (lower = more pressure)
//   cap       max enemies alive at once
//   waveSpeed multiplier on enemy movement speed
//   rule      optional special rule, see LEVEL_RULES
// ---------------------------------------------------------------------------
const LEVELS = [
  {
    n: 1, name: 'OPENING BELL', teach: 'Shoot the scrappers. Every shot costs PULSE.',
    time: 30, quota: 5, kinds: ['scrapper'], spawn: 1.5, cap: 3, waveSpeed: 1,
    noRicochet: true,
  },
  {
    n: 2, name: 'RETURN TO SENDER', teach: 'Misses bounce back. Aim, or pay twice.',
    time: 30, quota: 7, kinds: ['scrapper'], spawn: 1.35, cap: 3, waveSpeed: 1,
    rule: 'ricochet',
  },
  {
    n: 3, name: 'TOO CLOSE', teach: 'You touched it. It died. Shooting costs PULSE.',
    time: 30, quota: 8, kinds: ['scrapper'], spawn: 1.2, cap: 4, waveSpeed: 1,
    rule: 'ram',
  },
  {
    n: 4, name: 'DRIFTERS', teach: 'They soak two shots. Line them up.',
    time: 32, quota: 9, kinds: ['scrapper', 'drifter'], spawn: 1.3, cap: 4, waveSpeed: 1,
  },
  {
    n: 5, name: 'GUNNERS', teach: 'The purple ones shoot back. Dash through it.',
    time: 32, quota: 10, kinds: ['scrapper', 'drifter', 'lancer'], spawn: 1.2, cap: 4, waveSpeed: 1,
  },
  {
    n: 6, name: 'TIGHT BUDGET', teach: 'Caps are 3 until you clear it.',
    time: 36, quota: 11, kinds: ['scrapper', 'drifter', 'lancer'], spawn: 1.05, cap: 5, waveSpeed: 1.05,
    rule: 'budget',
  },
  {
    n: 7, name: 'DEBT COLLECTOR', teach: 'Win by surviving 12 seconds in OVERDRAFT.',
    time: 40, quota: 10, kinds: ['scrapper', 'drifter'], spawn: 1.0, cap: 5, waveSpeed: 1.1,
    rule: 'overdraftWindow',
  },
  {
    n: 8, name: 'THE WALL', teach: 'Armoured. Only weak spots finish it.',
    time: 40, quota: 10, kinds: ['scrapper', 'drifter', 'lancer', 'brute'], spawn: 1.05, cap: 5, waveSpeed: 1.1,
    rule: 'armour',
  },
  {
    n: 9, name: 'CHECKOUT', teach: 'Everything at once. Nothing held back.',
    time: 48, quota: 10, kinds: ['scrapper', 'drifter', 'lancer', 'brute'], spawn: 1.0, cap: 5, waveSpeed: 1.1,
  },
];

// Levels past the table reuse the last entry with a difficulty multiplier, so the
// run never ends on its own — you die, or you keep going.
function levelFor(n) {
  const base = LEVELS[Math.min(n, LEVELS.length) - 1];
  if (n <= LEVELS.length) return { ...base, index: n, scaled: false };
  const over = n - LEVELS.length;
  return {
    ...base,
    index: n,
    scaled: true,
    name: base.name + ' +' + over,
    time: Math.min(70, base.time + over * 3),
    quota: base.quota + Math.round(over * 2.5),
    spawn: Math.max(0.45, base.spawn - over * 0.05),
    cap: Math.min(11, base.cap + over),
    waveSpeed: Math.min(1.6, base.waveSpeed + over * 0.05),
  };
}

const CARDS = [
  { id: 'surplus',  name: 'SURPLUS',      desc: '+3 max PULSE, topped up now.',        apply: (s) => { s.player.maxHp += 3; s.player.hp = s.player.maxHp; } },
  { id: 'vampire',  name: 'VAMPIRE',      desc: 'Kills refund +1 PULSE.',              apply: (s) => { s.mods.refundBonus += 1; } },
  { id: 'quick',    name: 'QUICK HANDS',  desc: 'Fire rate +35%.',                     apply: (s) => { s.mods.fireRate *= 1.35; } },
  { id: 'pierce',   name: 'RICOCHET',     desc: 'Shots pass through 1 extra enemy.',   apply: (s) => { s.mods.pierce += 1; } },
  { id: 'ghost',    name: 'GHOST STEP',   desc: 'Dash cooldown -40%, longer i-frames.', apply: (s) => { s.mods.dashCd *= 0.6; s.mods.iFrames += 0.15; } },
  { id: 'thrift',   name: 'THRIFT',       desc: 'Every 4th shot is free.',             apply: (s) => { s.mods.freeEvery = 4; } },
];

function createState(seed = 1) {
  const rng = mulberry32(seed);
  return {
    rng,
    time: 0,
    mode: 'title', // title | play | pick | dead
    world: { w: W, h: H },
    es: 1,            // entity scale: keeps the game readable on small screens
    aimAssist: 0,     // radians of snap-assist (touch only)
    fireMode: 'assisted', // 'assisted' (auto-aim) | 'manual' (marksman) | 'auto' (turret)
    autoTarget: null, // id of the enemy the turret is tracking
    player: {
      x: W / 2, y: H / 2, vx: 0, vy: 0, r: 15,
      aim: -Math.PI / 2,
      hp: MAX_PULSE, maxHp: MAX_PULSE,
      fireCd: 0, dashCd: 0, dashT: 0, invuln: 0,
      lastShot: -99, lastHurt: -99,
      alive: true, hitFlash: 0, shotCount: 0,
    },
    mods: { fireRate: 1, pierce: 0, refundBonus: 0, dashCd: 1.15, iFrames: 0.28, freeEvery: 0 },
    bullets: [],
    enemies: [],
    particles: [],
    floaters: [],
    wallMarks: [],
    events: [],
    // level state
    level: 1,          // current level number (1-based)
    levelKills: 0,     // kills banked toward this level's quota
    levelT: 0,         // seconds elapsed inside the level
    levelState: 'fight', // fight | clear | fail | teach
    teachT: 0,         // time left on the level card
    failT: 0,          // time left on the fail card
    clearT: 0,
    banked: 0,         // PULSE carried into the next level
    overdraftT: 0,     // seconds spent below zero (level 7 win condition)
    levelsCleared: 0,
    retries: 0,
    best: null,
    // kept for the HUD/test contract: wave mirrors the level number
    wave: 1,
    waveT: 0,
    waveLen: 30,
    spawnT: 1.2,
    kills: 0,
    streak: 0,
    streakT: 0,
    bestStreak: 0,
    score: 0,
    shotsFired: 0,
    shotsHit: 0,
    damageTaken: 0,
    shake: 0,
    hitstop: 0,
    slowmo: 0,
    flashRed: 0,
    pick: null,
    cardsTaken: [],
    nextId: 1,
    deadT: 0,
    lastKill: -99,
  };
}

// `data` must never contain a `type` key: spreading it after `type` silently
// renames the event and every handler that switches on it stops matching.
function emit(s, type, data = {}) {
  if (data && 'type' in data) throw new Error(`emit('${type}') data must not contain 'type'`);
  s.events.push({ type, ...data });
}

// Card screens freeze the fight but must not freeze the debris: a hard cut to a
// static screen reads as a bug, a settling screen reads as a beat.
function tickCosmetics(s, dt) {
  for (let i = s.particles.length - 1; i >= 0; i--) {
    const q = s.particles[i];
    q.life -= dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.94; q.vy *= 0.94;
    if (q.life <= 0) s.particles.splice(i, 1);
  }
  for (let i = s.floaters.length - 1; i >= 0; i--) {
    const f = s.floaters[i];
    f.life -= dt; f.y -= 44 * dt;
    if (f.life <= 0) s.floaters.splice(i, 1);
  }
  s.shake = Math.max(0, s.shake - dt * 40);
  s.flashRed = Math.max(0, s.flashRed - dt * 3);
  s.hitstop = 0;
}

// Reshape the arena. Keeps entities inside the new bounds and pulls the player
// toward the middle so a rotation never traps them in a wall.
function setWorld(s, w, h) {
  s.world.w = clamp(Math.round(w), MIN_W, 4000);
  s.world.h = clamp(Math.round(h), MIN_H, 4000);
  // One scale for everything that moves, so a 390px phone plays like the 1280px build.
  s.es = clamp(Math.min(s.world.w, s.world.h) / REF_MIN, 0.62, 1.25);
  s.player.r = 15 * s.es;
  const p = s.player;
  p.x = clamp(p.x, 24, s.world.w - 24);
  p.y = clamp(p.y, 24, s.world.h - 24);
  for (const e of s.enemies) {
    e.x = clamp(e.x, -40, s.world.w + 40);
    e.y = clamp(e.y, -40, s.world.h + 40);
  }
}

function startRun(s) {
  const world = { w: s.world.w, h: s.world.h };
  const fresh = createState(Math.floor(s.rng() * 1e9));
  Object.assign(s, fresh, { mode: 'play', world });
  // start the player in the middle of *this* screen
  setWorld(s, world.w, world.h);
  s.player.x = world.w / 2;
  s.player.y = world.h / 2;
  // open on the level card so the player always knows what this level wants
  s.level = 1;
  s.wave = 1;
  s._lv = levelFor(1);
  s.levelState = 'teach';
  s.teachT = 1.7;
  emit(s, 'start');
  return s;
}

// Called when the player takes an augment between levels: the next fight begins,
// and the health banked from the clear is paid back as a small top-up.
function beginNextLevel(s) {
  s.levelState = 'fight';
  s.enemies.length = 0;
  s.spawnT = 0.5;
  s.levelT = 0;
  s.levelKills = 0;
  s.overdraftT = 0;
  // clearing a level heals 1; keeping the augment pick means you choose your power
  s.player.hp = Math.min(s.player.maxHp, s.player.hp + 1);
  s._lv = levelFor(s.level);
  s.teachT = 1.5;
  emit(s, 'levelStart', { level: s.level, name: s._lv.name });
}

// Restart the current level after a timeout. No progress is lost, no health is
// taken: the only cost of failing is the thirty seconds you spent.
function retryLevel(s) {
  s.levelState = 'fight';
  s.enemies.length = 0;
  s.levelT = 0;
  s.levelKills = 0;
  s.overdraftT = 0;
  s.spawnT = 0.5;
  s.retries += 1;
  s._lv = levelFor(s.level);
  emit(s, 'levelStart', { level: s.level, name: s._lv.name });
}

// ---------------------------------------------------------------------------
// input: { ax, ay, aimX, aimY, fire, dash }
function step(s, dt, input) {
  s.events.length = 0;
  if (s.mode !== 'play') { s.time += dt; return s; }

  if (s.hitstop > 0) { s.hitstop -= dt; s.shake = Math.max(0, s.shake - dt * 40); return s; }

  s.time += dt;
  const p = s.player;
  const es = s.es;
  const L = s._lv || (s._lv = levelFor(s.level));

  // ---- level cards freeze the fight while they are up -----------------------
  if (s.levelState === 'teach' || s.levelState === 'clear' || s.levelState === 'fail') {
    s.teachT -= dt; s.clearT -= dt; s.failT -= dt;
    // let particles and floaters settle so the screen does not freeze mid-burst
    tickCosmetics(s, dt);
    const t = s.levelState === 'teach' ? s.teachT : s.levelState === 'clear' ? s.clearT : s.failT;
    if (t <= 0) {
      if (s.levelState === 'clear') {
        s.level += 1;
        s.levelsCleared += 1;
        s.wave = s.level;
        s._lv = levelFor(s.level);
        s.levelKills = 0; s.levelT = 0; s.overdraftT = 0;
        s.levelState = 'pick';
        openCardPick(s);
        if (s.mode === 'play') s.levelState = 'pick';
      } else if (s.levelState === 'fail') {
        // retry the same level: keep the PULSE you have, keep your augments
        s.retries += 1;
        s.levelKills = 0; s.levelT = 0; s.overdraftT = 0;
        s.levelState = 'fight';
        s.enemies.length = 0;
        s.spawnT = 0.6;
        emit(s, 'retry', { level: s.level });
      } else {
        s.levelState = 'fight';
        s.spawnT = 0.5;
      }
    }
    return s;
  }

  s.levelT += dt;
  s.waveT = s.levelT;
  s.waveLen = L.time;
  // level 7's win condition: the overdraft clock only counts once you are under
  if (L.rule === 'overdraftWindow') {
    if (s.player.hp < 0) s.overdraftT += dt;
    // the fight starts you in debt if you arrived healthy, so the goal is reachable
    else if (s.levelT > 1.2 && s.player.hp > 0 && s.overdraftT === 0 && s.levelKills === 0) {
      // a nudge: the level pays nothing for staying safe
    }
  }

  // ---- level outcome --------------------------------------------------------
  const quotaDone = s.levelKills >= L.quota;
  const clockDone = s.levelT >= L.time;
  // SPECIAL RULE: the overdraft level is won by surviving low, not by killing
  const overdraftDone = L.rule === 'overdraftWindow' && s.overdraftT >= 12;
  if (s.mode === 'play' && (quotaDone || overdraftDone)) {
    s.levelState = 'clear';
    s.clearT = 1.5;
    s.banked = s.player.hp;
    if (!s.best) s.best = { level: s.level, kills: s.kills, score: s.score };
    emit(s, 'levelClear', { level: s.level, name: L.name });
    return s;
  }
  if (s.mode === 'play' && clockDone && !quotaDone) {
    s.levelState = 'fail';
    s.failT = 1.6;
    emit(s, 'levelFail', { level: s.level, kills: s.levelKills, quota: L.quota });
    return s;
  }

  // ---- player movement -----------------------------------------------------
  const ax = input.ax || 0, ay = input.ay || 0;
  const mag = Math.hypot(ax, ay) || 1;
  const nx = ax / mag, ny = ay / mag;
  const speed = 335 * es;
  const accel = 14;
  if (p.dashT > 0) {
    p.dashT -= dt;
    p.invuln = Math.max(p.invuln, 0.05);
    // aim latches through the dash: your thumb is on B, not on the aim
    if (p.latchAim != null) p.aim = p.latchAim;
  } else {
    p.vx += (nx * speed * (ax || ay ? 1 : 0) - p.vx) * Math.min(1, accel * dt);
    p.vy += (ny * speed * (ax || ay ? 1 : 0) - p.vy) * Math.min(1, accel * dt);
  }
  if (p.dashT <= 0) p.latchAim = null;
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt * 4);

  if (input.dash && p.dashCd <= 0) {
    p.latchAim = p.aim;
    const dx = ax || ay ? nx : Math.cos(p.aim);
    const dy = ax || ay ? ny : Math.sin(p.aim);
    p.vx = dx * 1100 * es; p.vy = dy * 1100 * es;
    p.dashT = 0.15;
    p.dashCd = s.mods.dashCd;
    p.invuln = s.mods.iFrames;
    emit(s, 'dash');
    for (let i = 0; i < 10; i++) spawnParticle(s, p.x, p.y, '#6ff5ff', 120);
  }

  p.x += p.vx * dt; p.y += p.vy * dt;
  const m = 24;
  const ww = s.world.w, wh = s.world.h;
  if (p.x < m) { p.x = m; p.vx *= -0.4; }
  if (p.x > ww - m) { p.x = ww - m; p.vx *= -0.4; }
  if (p.y < m) { p.y = m; p.vy *= -0.4; }
  if (p.y > wh - m) { p.y = wh - m; p.vy *= -0.4; }

  // aim: a thumb cannot reach under the control pads, so clamp the REQUESTED
  // point (not the resolved shot angle) into the reachable area. Only when the
  // on-screen pads are actually there — on desktop this would corrupt aim.
  if (p.dashT > 0 && p.latchAim != null) {
    // dashing with a thumb on B: keep the line you had when you pressed it
    p.aim = p.latchAim;
  } else if (input.aimX != null) {
    let tx = input.aimX, ty = input.aimY;
    const limitY = s.world.h - 170 * es;
    if (s.touchUi && ty > limitY) ty = limitY;
    const dx0 = tx - p.x, dy0 = ty - p.y;
    if (Math.abs(dx0) + Math.abs(dy0) > 8) p.aim = Math.atan2(dy0, dx0);
  }

  // ---- NO PASSIVE REGEN ----
  // PULSE only comes back from kills. Standing still and dodging cannot heal you,
  // so running away is never a strategy: if you stop shooting, you only bleed.

  // ---- shooting ------------------------------------------------------------
  p.fireCd -= dt;
  const over = p.hp <= 0;
  const mode = FIRE_MODES[s.fireMode] || FIRE_MODES.manual;

  // TURRET mode: the gun aims itself. Pick the nearest enemy, aim at it, and
  // fire automatically. The player's job becomes positioning, not precision.
  let fireWanted = input.fire;
  if (mode.autoAim) {
    let tgt = null, bestD = Infinity;
    for (const e of s.enemies) {
      if (e.dead || e.spawnT > 0) continue;
      const d2e = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
      if (d2e < bestD) { bestD = d2e; tgt = e; }
    }
    if (tgt) {
      // lead the target slightly, and snap the aim so the turret reads as a machine
      p.aim = Math.atan2(tgt.y + tgt.vy * 0.06 - p.y, tgt.x + tgt.vx * 0.06 - p.x);
      s.autoTarget = tgt.id;
      // TURRET fires for you; AUTO-AIM only points the gun and waits for your
      // trigger. `autoFire` is the whole difference between the two modes.
      if (mode.autoFire) fireWanted = p.hp > 0.6;
      else fireWanted = input.fire;
    } else {
      s.autoTarget = null;
      fireWanted = false;
    }
  } else {
    s.autoTarget = null;
  }

  if (fireWanted && p.fireCd <= 0 && p.hp > OVERDRAFT_FLOOR) {
    const fm = FIRE_MODES[s.fireMode] || FIRE_MODES.manual;
    const free = s.mods.freeEvery > 0 && p.shotCount > 0 && p.shotCount % s.mods.freeEvery === 0;
    // RULE 'budget' (level 6): every shot costs 2 until you clear it
    const budgetRule = s._lv && s._lv.rule === 'budget';
    const cost = free ? 0 : (budgetRule ? 2 : fm.cost);
    // You cannot fire the shot that would push you past the floor.
    if (p.hp - cost > OVERDRAFT_FLOOR) {
      p.hp -= cost;
      p.shotCount++;

      p.fireCd = fm.fireRate / s.mods.fireRate;

    for (let j = i + 1; j < s.enemies.length; j++) {
      const a = s.enemies[i], b = s.enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const min = a.r + b.r;

    s.deadT = 0;
    s.shake = 22;

      this.scale = Math.min(ww / W, wh / H);
      this.worldW = W; this.worldH = H;
      this.ox = (ww - W * this.scale) / 2;
      this.oy = (wh - H * this.scale) / 2;
      this.hudLeft = this.ox;          // HUD anchors to the arena edge
      this.hudRight = this.ox + W * this.scale;
      this.hudTop = this.oy;
      this.hudBottom = this.oy + H * this.scale;
    }
  }

  // The surface the HUD lays itself out on: the window on desktop, the arena on phones.
  get uiW() { return this.mobile ? this.worldW : this.canvas.width / this.dpr; }
  get uiH() { return this.mobile ? this.worldH : this.canvas.height / this.dpr; }

  // page/client coords (CSS px) -> world coords
  toWorld(sx, sy) {
    return { x: (sx - this.ox) / this.scale, y: (sy - this.oy) / this.scale };
  }

  // page/client coords -> the surface the HUD uses (window px on desktop)
  toUI(sx, sy) {
    if (this.mobile) return this.toWorld(sx, sy);
    return { x: sx, y: sy };
  }

  draw(s, mouse, dt) {
    const c = this.ctx;
    this.t += dt;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.fillStyle = '#04050a';
    c.fillRect(0, 0, this.canvas.width / this.dpr, this.canvas.height / this.dpr);

    // Trauma shake: amplitude scales with trauma^2 so small hits are felt and big
    // hits are violent, and it uses smooth noise rather than white noise so it
    // reads as a camera kick instead of a stutter.
    const shake = s.shake;
    const trauma = Math.min(1, shake / 24);
    const amp = shake * trauma;
    const n1 = Math.sin(this.t * 61.3) * Math.sin(this.t * 23.7);
    const n2 = Math.sin(this.t * 54.1 + 1.7) * Math.sin(this.t * 19.3 + 0.5);
    const sx = n1 * amp;
    const sy = n2 * amp;

    c.save();
    c.translate(this.ox + sx, this.oy + sy);
    c.scale(this.scale, this.scale);
    c.beginPath();
    c.rect(0, 0, this.worldW, this.worldH);
    c.clip();

    this.drawArena(s);
    if (s.mode === 'title') {
      this.drawTitleBg(s);
    } else {
      this.drawEntities(s);
      this.drawParticles(s);
      this.drawAttractTag(s);
    }
    c.restore();

    // HUD: phones draw in world space (world == screen), desktop draws in CSS
    // pixels so text stays crisp and the chrome hugs the real window edges.
    c.save();
    if (this.mobile) {
      c.translate(this.ox, this.oy);
      c.scale(this.scale, this.scale);
    }
    if (s.mode !== 'title') this.drawHUD(s);
    if (s.mode === 'title') {
      this.drawTitle(s);
      this.drawRotateHint();
    }
    if (s.mode === 'pick') this.drawPick(s);
    if (s.mode === 'play' && s.levelState === 'teach') this.drawTeach(s);
    if (s.mode === 'play' && (s.levelState === 'clear' || s.levelState === 'fail')) {
      this.drawLevelCard(s, s.levelState);
    }
    if (s.mode === 'dead') this.drawDead(s);
    c.restore();

    // ---- post pass: scanlines + phosphor edge glow + film grain ----
    // The research says retro reads as deliberate style, but only if it stays
    // legible: lines stay at 2px apart with 8% opacity, and the whole pass is
    // skipped for reduced-motion players and throttled on phones.
    if (!this.reduceMotion) {
      const cw = this.canvas.width / this.dpr, ch = this.canvas.height / this.dpr;
      // scanlines: one dark line every 3 CSS px, scaled by device pixel ratio
      const step = this.mobile ? 3 : 3;
      c.save();
      c.globalAlpha = 0.10;
      c.fillStyle = '#000';
      c.beginPath();
      for (let y = 0; y < ch; y += step) c.rect(0, y, cw, 1);
      c.fill();
      c.restore();

      // phosphor vignette: the edges of a CRT are dimmer than the middle
      const g = c.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.34,
                                       cw / 2, ch / 2, Math.max(cw, ch) * 0.78);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.55)');
      c.fillStyle = g;
      c.fillRect(0, 0, cw, ch);

      // coloured edge fringe (chromatic aberration, done cheaply at the borders)
      if (!this.mobile) {
        c.save();
        c.globalAlpha = 0.05;
        c.fillStyle = '#ff2a6d';
        c.fillRect(0, 0, 3, ch);
        c.fillStyle = '#05d9e8';
        c.fillRect(cw - 3, 0, 3, ch);
        c.restore();
      }

      // sparse grain: sells 'this is a screen', not 'this is a CSS gradient'
      c.save();
      c.globalAlpha = 0.035;
      c.fillStyle = '#9fd8ff';
      const n = this.mobile ? 26 : 60;
      for (let i = 0; i < n; i++) {
        const gx = (Math.random() * cw) | 0, gy = (Math.random() * ch) | 0;
        c.fillRect(gx, gy, 1, 1);
      }
      c.restore();
    }

    // full-screen colour flashes
    if (s.flashRed > 0.01) {
      c.fillStyle = `rgba(255,20,60,${s.flashRed * 0.20})`;
      c.fillRect(0, 0, this.canvas.width / this.dpr, this.canvas.height / this.dpr);
    }
    const over = s.mode !== 'title' && s.player.hp <= 0;
    if (over) {
      const pulse = 0.10 + Math.sin(this.t * 6) * 0.05;
      const g = c.createRadialGradient(
        this.canvas.width / this.dpr / 2, this.canvas.height / this.dpr / 2, 40,
        this.canvas.width / this.dpr / 2, this.canvas.height / this.dpr / 2,
        this.canvas.width / this.dpr * 0.75,
      );
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(255,0,50,${pulse})`);
      c.fillStyle = g;
      c.fillRect(0, 0, this.canvas.width / this.dpr, this.canvas.height / this.dpr);
    }
  }

  drawArena(s) {
    const c = this.ctx;
    const W = this.worldW, H = this.worldH;
    // deep background
    const g = c.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, W * 0.72);
    g.addColorStop(0, '#0b1222');
    g.addColorStop(0.6, '#070a13');
    g.addColorStop(1, '#04050a');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    // grid
    const cell = 64;
    const off = (this.t * 10) % cell;
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(90,180,255,0.055)';
    c.beginPath();
    for (let x = -off; x < W + cell; x += cell) { c.moveTo(x, 0); c.lineTo(x, H); }
    for (let y = -off; y < H + cell; y += cell) { c.moveTo(0, y); c.lineTo(W, y); }
    c.stroke();

    // arena boundary
    c.strokeStyle = s.player.hp <= 0 ? 'rgba(255,60,90,0.35)' : 'rgba(110,245,255,0.22)';
    c.lineWidth = 2;
    c.strokeRect(14, 14, W - 28, H - 28);

    // corner brackets
    c.strokeStyle = s.player.hp <= 0 ? 'rgba(255,80,110,0.8)' : 'rgba(110,245,255,0.55)';
    c.lineWidth = 3;
    const L = 26, P = 14;
    const corners = [[P, P, 1, 1], [W - P, P, -1, 1], [P, H - P, 1, -1], [W - P, H - P, -1, -1]];
    for (const [x, y, dx, dy] of corners) {
      c.beginPath();
      c.moveTo(x + dx * L, y); c.lineTo(x, y); c.lineTo(x, y + dy * L);
      c.stroke();
    }
  }

  drawTitleBg(s) {
    const c = this.ctx;
    const W = this.worldW, H = this.worldH;
    // slow drifting verticals + a horizon glow
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const x = ((this.t * (18 + i * 9) + i * 260) % (W + 400)) - 200;
      const grd = c.createLinearGradient(x, 0, x, H);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(0.5, i % 2 ? 'rgba(110,245,255,0.05)' : 'rgba(255,60,120,0.05)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = grd;
      c.fillRect(x, 0, 120 + i * 40, H);
    }
    // fake enemies drifting for texture
    for (let i = 0; i < 7; i++) {
      const a = this.t * 0.25 + i * 1.1;
      const rr = 250 + i * 46;
      const x = W / 2 + Math.cos(a) * rr * 1.5;
      const y = H / 2 + Math.sin(a * 0.8) * rr * 0.6;
      const col = i % 2 ? '#ff5f6d' : '#6ff5ff';
      c.globalAlpha = 0.22;
      c.drawImage(glowSprite(col), x - 40, y - 40, 80, 80);
      c.globalAlpha = 1;
    }
    c.restore();
  }

  drawEntities(s) {
    const c = this.ctx;
    const p = s.player;

    // player trail
    if (Math.hypot(p.vx, p.vy) > 80) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      const len = Math.min(70, Math.hypot(p.vx, p.vy) * 0.07);
      const a = Math.atan2(p.vy, p.vx);
      const grd = c.createLinearGradient(p.x, p.y, p.x - Math.cos(a) * len, p.y - Math.sin(a) * len);
      grd.addColorStop(0, 'rgba(110,245,255,0.35)');
      grd.addColorStop(1, 'rgba(110,245,255,0)');
      c.strokeStyle = grd;
      c.lineWidth = 8;
      c.lineCap = 'round';
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - Math.cos(a) * len, p.y - Math.sin(a) * len); c.stroke();
      c.restore();
    }

    // enemies
    for (const e of s.enemies) {
      const fade = e.spawnT > 0 ? 1 - e.spawnT / 0.28 : 1;
      c.save();
      c.globalAlpha = 0.35 + fade * 0.65;
      c.translate(e.x, e.y);
      c.rotate(this.angleOf(e));
      const col = e.hitFlash > 0.3 ? '#ffffff' : e.color;
      c.strokeStyle = col;
      c.fillStyle = hexA(col, 0.13);
      c.lineWidth = 2.5;
      c.lineJoin = 'round';
      const r = e.r;
      if (e.type === 'scrapper') {
        c.beginPath();
        c.moveTo(r, 0); c.lineTo(-r * 0.8, r * 0.8); c.lineTo(-r * 0.45, 0); c.lineTo(-r * 0.8, -r * 0.8);
        c.closePath(); c.fill(); c.stroke();
      } else if (e.type === 'drifter') {
        c.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * TAU;
          const R = i % 2 ? r * 0.72 : r;
          i ? c.lineTo(Math.cos(a) * R, Math.sin(a) * R) : c.moveTo(Math.cos(a) * R, Math.sin(a) * R);
        }
        c.closePath(); c.fill(); c.stroke();
      } else if (e.type === 'lancer') {
        c.beginPath();
        c.moveTo(r, 0); c.lineTo(0, r * 0.7); c.lineTo(-r, 0); c.lineTo(0, -r * 0.7);
        c.closePath(); c.fill(); c.stroke();
        c.beginPath(); c.arc(0, 0, r * 0.28, 0, TAU); c.fillStyle = col; c.fill();
      } else {
        c.rotate(this.t * 0.6);
        c.beginPath(); c.rect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4); c.fill(); c.stroke();
        c.beginPath(); c.arc(0, 0, r * 0.42, 0, TAU); c.stroke();
        c.beginPath(); c.arc(0, 0, r, 0.4, 1.2); c.stroke();
        c.beginPath(); c.arc(0, 0, r, 3.5, 4.3); c.stroke();
      }
      c.restore();

      // hp pips for multi-hp enemies
      if (e.hp > 1) {
        c.save();
        c.translate(e.x, e.y);
        c.fillStyle = 'rgba(255,255,255,0.85)';
        const n = Math.ceil(e.hp), wpi = 4;
        for (let i = 0; i < n; i++) c.fillRect(-(n * wpi) / 2 + i * wpi, e.r + 6, 2.5, 2.5);
        c.restore();
      }
    }

    // wall impact marks left by ricochets (permanence: the arena remembers your misses)
    c.save();
    for (const m of s.wallMarks || []) {
      c.globalAlpha = Math.max(0, m.life / 2.5) * 0.5;
      c.strokeStyle = '#ff3b5c';
      c.lineWidth = 1.5;
      c.beginPath();
      c.arc(m.x, m.y, 5 + (1 - m.life / 2.5) * 9, 0, Math.PI * 2);
      c.stroke();
    }
    c.restore();

    // enemy bullets
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const b of s.bullets) {
      if (b.friendly) continue;
      c.drawImage(glowSprite('#ff2d55'), b.x - 26, b.y - 26, 52, 52);
      c.fillStyle = '#ffe1e7';
      c.beginPath(); c.arc(b.x, b.y, 4.5, 0, TAU); c.fill();
    }
    c.restore();

    // muzzle flash: a brief bloom at the barrel sells the shot costing something
    if (s.time - p.lastShot < 0.07) {
      const k = 1 - (s.time - p.lastShot) / 0.07;
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = k * 0.9;
      const col = p.hp <= 0 ? '#ff3b5c' : '#bffcff';
      c.drawImage(glowSprite(col), p.x + Math.cos(p.aim) * 24 - 34, p.y + Math.sin(p.aim) * 24 - 34, 68, 68);
      c.restore();
    }

    // player bullets with trails
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const b of s.bullets) {
      if (!b.friendly) continue;
      const col = b.over ? '#ff3b5c' : '#6ff5ff';
      if (b.trail) {
        for (let i = 0; i < b.trail.length; i++) {
          const t = b.trail[i];
          const a = (i / b.trail.length) * 0.5;
          c.globalAlpha = a;
          c.drawImage(glowSprite(col), t.x - 11, t.y - 11, 22, 22);
        }
        c.globalAlpha = 1;
      }
      c.drawImage(glowSprite(col), b.x - 20, b.y - 20, 40, 40);
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(b.x, b.y, 3.4, 0, TAU); c.fill();
    }
    c.restore();

    // player
    this.drawPlayer(s);
  }

  angleOf(e) {
    const p = { x: 0, y: 0 };
    const a = Math.atan2(e.vy, e.vx);
    return Number.isFinite(a) ? a : 0;
  }

  drawPlayer(s) {
    const c = this.ctx;
    const p = s.player;
    const over = p.hp <= 0;
    const main = over ? '#ff3b5c' : '#6ff5ff';

    // heartbeat ring when in overdraft
    if (over) {
      const beat = (Math.sin(this.t * 5.4) + 1) / 2;
      c.save();
      c.globalAlpha = 0.35 + beat * 0.3;
      c.strokeStyle = 'rgba(255,60,90,0.8)';
      c.lineWidth = 2;
      c.beginPath();
      c.arc(p.x, p.y, 30 + beat * 16, 0, TAU);
      c.stroke();
      c.restore();
    }

    c.save();
    c.translate(p.x, p.y);
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = p.invuln > 0 && Math.floor(this.t * 20) % 2 ? 0.45 : 0.9;
    c.drawImage(glowSprite(main), -46, -46, 92, 92);
    c.restore();

    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.aim);
    const flick = p.hitFlash > 0 ? '#ffffff' : main;
    c.strokeStyle = flick;
    c.fillStyle = hexA(flick, 0.18);
    c.lineWidth = 2.6;
    c.lineJoin = 'round';
    // arrowhead hull
    c.beginPath();
    c.moveTo(18, 0); c.lineTo(-11, 12); c.lineTo(-5, 0); c.lineTo(-11, -12);
    c.closePath(); c.fill(); c.stroke();
    // muzzle
    c.beginPath(); c.moveTo(18, 0); c.lineTo(26, 0); c.stroke();
    // core
    c.beginPath(); c.arc(-2, 0, 3.2, 0, TAU); c.fillStyle = flick; c.fill();
    c.restore();

    // aim laser (fades fast when you fire — sells the cost)
    const sinceShot = s.time - p.lastShot;
    const laserA = Math.max(0, 1 - sinceShot * 2.4) * 0.5;
    if (laserA > 0.01) {
      c.save();
      c.globalAlpha = laserA;
      c.strokeStyle = hexA(main, 0.6);
      c.lineWidth = 1;
      c.setLineDash([6, 10]);
      c.beginPath();
      c.moveTo(p.x + Math.cos(p.aim) * 26, p.y + Math.sin(p.aim) * 26);
      c.lineTo(p.x + Math.cos(p.aim) * 900, p.y + Math.sin(p.aim) * 900);
      c.stroke();
      c.restore();
    }
  }

  drawParticles(s) {
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const q of s.particles) {
      const a = Math.max(0, q.life / q.max);
      c.globalAlpha = a;
      c.fillStyle = q.color;
      c.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    c.restore();

    c.save();
    c.font = '700 16px ui-monospace, Menlo, monospace';
    c.textAlign = 'center';
    for (const f of s.floaters) {
      c.globalAlpha = Math.min(1, f.life / 0.4);
      c.font = `700 ${f.size}px ui-monospace, Menlo, monospace`;
      c.fillStyle = f.color;
      c.shadowColor = f.color;
      c.shadowBlur = 12;
      c.fillText(f.text, f.x, f.y);
    }
    c.restore();
  }

  // Honest label whenever the attract-mode bot is driving.
  drawAttractTag(s) {
    if (!s.hermes) return;
    const c = this.ctx;
    c.save();
    c.font = '700 11px ui-monospace, Menlo, monospace';
    c.textAlign = 'left';
    c.fillStyle = 'rgba(255,209,102,0.9)';
    c.fillText('ATTRACT MODE', 34, 112);
    c.fillStyle = 'rgba(255,209,102,0.45)';
    c.fillText('bot is playing — click to take over', 34, 128);
    c.restore();
  }

  drawHUD(s) {
    const c = this.ctx;
    const W = this.uiW, H = this.uiH;
    const p = s.player;
    const over = p.hp <= 0;
    // phones: respect the notch/home bar and shrink the chrome
    const mob = this.mobile;
    const topPad = mob ? 54 : 0;
    const botPad = mob ? 26 : 0;
    const uiK = mob ? 0.72 : 1;
    // desktop: sit just inside the arena box; phone: inside the screen safely
    const padL = mob ? 0 : this.ox;
    const padR = mob ? 0 : (this.uiW - this.ox - W * this.scale) * 0 + (this.uiW - (this.ox + W * this.scale));

    // top-left: score
    c.save();
    c.font = '700 13px ui-monospace, Menlo, monospace';
    c.fillStyle = 'rgba(160,190,215,0.55)';
    c.textAlign = 'left';
    c.fillText('SCORE', 24 + padL, 26 + topPad);
    c.font = `700 ${Math.round(30 * uiK)}px ui-monospace, Menlo, monospace`;
    c.fillStyle = '#dff6ff';
    c.shadowColor = 'rgba(110,245,255,0.5)';
    c.shadowBlur = 14;
    c.fillText(String(s.score).padStart(6, '0'), 22 + padL, 22 + topPad + 30 * uiK);
    c.restore();

    // top-right: the level number and the quota, which is the actual goal
    const LV = s._lv || { quota: 1, time: 1 };
    c.save();
    c.textAlign = 'right';
    c.font = '700 12px ui-monospace, Menlo, monospace';
    c.fillStyle = 'rgba(160,190,215,0.55)';
    c.fillText('LEVEL', W - 24 - padR, 24 + topPad);
    c.font = `700 ${Math.round(28 * uiK)}px ui-monospace, Menlo, monospace`;
    c.fillStyle = over ? '#ff5f6d' : '#dff6ff';
    c.fillText(String(s.level).padStart(2, '0'), W - 22 - padR, 20 + topPad + 28 * uiK);
    // quota pips: filled as you kill, so progress is readable at a glance
    const q = Math.min(LV.quota, s.levelKills);
    c.font = '700 12px ui-monospace, Menlo, monospace';
    c.fillStyle = q >= LV.quota ? '#7dffb2' : 'rgba(255,209,102,0.95)';
    c.fillText(`${q}/${LV.quota} KILLS`, W - 24 - padR, 16 + topPad + 28 * uiK + 18);
    c.restore();

    // centre-top: the level countdown, hugging the top edge so it never crosses
    // the middle of the arena the way it did before
    const bw = Math.min(220, W * 0.34);
    const leftT = Math.max(0, LV.time - s.levelT);
    const urgency = leftT <= 6;
    const clockY = 10 + (this.safe ? this.safe.top : 0) + (mob ? 6 : 0);
    c.save();
    c.fillStyle = 'rgba(255,255,255,0.08)';
    c.fillRect(W / 2 - bw / 2, clockY, bw, 3);
    c.fillStyle = urgency ? '#ff5f6d' : (over ? '#ff5f6d' : 'rgba(110,245,255,0.75)');
    c.fillRect(W / 2 - bw / 2, clockY, bw * Math.min(1, s.levelT / LV.time), 3);
    c.textAlign = 'center';
    c.font = `800 ${urgency ? 15 : 12}px ui-monospace, Menlo, monospace`;
    c.fillStyle = urgency ? '#ff5f6d' : 'rgba(190,215,240,0.8)';
    c.fillText(`${leftT.toFixed(1)}s`, W / 2, clockY + 17);
    c.restore();

    // streak
    if (s.streak >= 3) {
      c.save();
      c.textAlign = 'center';
      c.font = '700 20px ui-monospace, Menlo, monospace';
      const a = Math.min(1, s.streakT / 2.6);
      c.globalAlpha = a;
      c.fillStyle = '#ffd166';
      c.shadowColor = '#ffd166';
      c.shadowBlur = 16;
      c.fillText(`x${s.streak} STREAK`, W / 2, 52 + topPad);
      c.restore();
    }

    // ---- PULSE bar ----
    const total = p.maxHp;
    const negCount = Math.abs(OVERDRAFT_FLOOR);
    const full = total + negCount;
    const sa = this.safe || { top: 0, right: 0, bottom: 0, left: 0 };
    const band = this.mobile ? this.controlBand().band : 150;
    const maxBar = mob ? W - sa.left - sa.right - 40 : W - 160;
    let segW = mob ? 20 : 30;
    const gap = mob ? 3 : 5;
    if (full * segW + (full - 1) * gap > maxBar) segW = Math.max(7, (maxBar - (full - 1) * gap) / full);
    const barW = full * segW + (full - 1) * gap;
    // sits just above the control band, left-aligned with the stick
    const bx = mob ? sa.left + 20 : W / 2 - barW / 2;
    const by = mob ? H - sa.bottom - band - 14 : H - 62;
    const segH = mob ? 14 : 20;

    c.save();
    c.font = '700 11px ui-monospace, Menlo, monospace';
    c.textAlign = 'left';
    c.fillStyle = over ? '#ff5f6d' : 'rgba(160,190,215,0.6)';
    const hpShown = Math.max(OVERDRAFT_FLOOR, Math.min(p.maxHp, p.hp));
    c.fillText(over ? `OVERDRAFT ${hpShown.toFixed(0)}` : `PULSE ${Math.floor(hpShown)}/${p.maxHp}`, bx, by - 9);
    if (over) {
      const blink = Math.sin(this.t * 12) > 0;
      c.textAlign = 'right';
      c.fillStyle = blink ? '#ff2d55' : 'rgba(255,45,85,0.35)';
      c.fillText('KILL TO REPAY', bx + barW, by - 10);
    }
    c.restore();

    for (let i = 0; i < full; i++) {
      const x = bx + i * (segW + gap);
      const isNeg = i >= total;
      const idx = i; // 0..total-1 positive, then negative credit
      // value represented: positive segments from left fill by hp; negative ones by |hp|
      let filled;
      if (!isNeg) filled = p.hp >= idx + 1 ? 1 : p.hp > idx ? p.hp - idx : 0;
      else {
        const negIdx = OVERDRAFT_FLOOR + (i - total); // -3,-2,-1
        filled = p.hp <= negIdx + 1 && p.hp > negIdx ? Math.min(1, negIdx + 1 - p.hp) : p.hp <= negIdx ? 1 : 0;
      }
      c.save();
      if (isNeg) {
        c.strokeStyle = p.hp <= 0 ? 'rgba(255,45,85,0.9)' : 'rgba(255,45,85,0.30)';
        c.lineWidth = 1.5;
        c.strokeRect(x + 0.5, by + 0.5, segW, segH);
        if (filled > 0) {
          c.fillStyle = 'rgba(255,45,85,0.85)';
          c.fillRect(x, by, segW * filled, segH);
        }
      } else {
        c.fillStyle = 'rgba(110,245,255,0.10)';
        c.fillRect(x, by, segW, segH);
        if (filled > 0) {
          const low = p.hp <= 2;
          const col = low ? '#ff3b5c' : '#6ff5ff';
          c.fillStyle = col;
          c.shadowColor = col;
          c.shadowBlur = 16;
          c.fillRect(x, by, segW * filled, segH);
        }
      }
      c.restore();
    }

    // dash cooldown pip
    c.save();
    const ready = p.dashCd <= 0;
    c.globalAlpha = ready ? 1 : 0.35;
    c.strokeStyle = ready ? '#9ffcff' : 'rgba(160,190,215,0.6)';
    c.lineWidth = 2;
    const dx = Math.min(W - 26, W / 2 + barW / 2 + 34), dy = by + (mob ? 8 : 10);
    c.beginPath(); c.arc(dx, dy, 8, 0, TAU); c.stroke();
    if (!ready) {
      c.beginPath();
      c.arc(dx, dy, 8, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - p.dashCd / s.mods.dashCd));
      c.stroke();
    } else {
      c.beginPath(); c.moveTo(dx - 4, dy - 5); c.lineTo(dx + 5, dy); c.lineTo(dx - 4, dy + 5); c.closePath(); c.stroke();
    }
    c.restore();

    // desktop: tappable pause + mode badge (no touch buttons on PC)
    if (!mob) {
      const px = W - 30, py = 30, pr = 15;
      this._deskPause = { x: px, y: py, r: pr };
      c.save();
      c.globalAlpha = 0.7;
      c.strokeStyle = '#9ffcff'; c.lineWidth = 2;
      c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.stroke();
      c.fillStyle = '#9ffcff';
      const bw2 = 3.2, bh2 = 12;
      c.fillRect(px - bw2 * 2.2, py - bh2 / 2, bw2, bh2);
      c.fillRect(px + bw2 * 1.2, py - bh2 / 2, bw2, bh2);
      c.restore();

      // mode badge, clickable. Three modes now, so derive the label and colour
      // from the mode itself rather than a two-way boolean.
      const modeId = s.fireMode || 'manual';
      const modeInfo = {
        manual:   { label: 'MARKSMAN · TAB',   fill: 'rgba(255,209,102,0.14)', line: '#ffd166', text: '#ffe9b8' },
        assisted: { label: 'AUTO-AIM · TAB',   fill: 'rgba(110,245,255,0.14)', line: '#6ff5ff', text: '#bffcff' },
        auto:     { label: 'TURRET · TAB',     fill: 'rgba(125,255,178,0.14)', line: '#7dffb2', text: '#c8ffdc' },
      }[modeId];
      const auto = modeId === 'auto';
      const label = modeInfo.label;
      c.save();
      c.font = '700 11px ui-monospace, Menlo, monospace';
      const tw = c.measureText(label).width + 20;
      const bx = W - 30 - pr * 2 - 12 - tw, by = 18;
      this._deskMode = { x: bx, y: by, w: tw, h: 24 };
      c.globalAlpha = 0.9;
      c.fillStyle = modeInfo.fill;
      c.strokeStyle = modeInfo.line;
      c.lineWidth = 1.5;
      roundRect(c, bx, by, tw, 24, 12);
      c.fill(); c.stroke();
      c.fillStyle = modeInfo.text;
      c.textAlign = 'center';
      c.fillText(label, bx + tw / 2, by + 16);
      c.restore();
    }

    // low-health vignette + heartbeat text
    if (p.hp <= 1.2 && !over) {
      c.save();
      c.globalAlpha = 0.5 + Math.sin(this.t * 7) * 0.2;
      c.font = '700 13px ui-monospace, Menlo, monospace';
      c.textAlign = 'center';
      c.fillStyle = '#ff3b5c';
      c.fillText(mob ? 'CRITICAL — STOP FIRING' : 'PULSE CRITICAL — STOP FIRING TO REGEN', W / 2, by - 26);
      c.restore();
    }
  }

  // ------------------------------------------------------------------
  // TOUCH LAYOUT — the single source of truth for both drawing and
  // hit-testing, so a button can never be drawn somewhere it isn't tappable.
  // Anchored to the real screen corners, scaled off the short edge, so the
  // controls use the whole square instead of fixed pixel offsets.
  // ------------------------------------------------------------------
  // How much vertical room the on-screen controls get. Derived from the SHORT
  // edge of the arena, then clamped to a fraction of the height so a wide, short
  // landscape window (a phone on its side, or a tablet) can never end up with
  // buttons that take a quarter of the screen.
  controlBand() {
    const W = this.worldW, H = this.worldH;
    if (!this.mobile) return { R: 56, pad: 18, band: 150, W, H };
    // Landscape phones are only ~390px tall, so HEIGHT is the binding constraint
    // there, not the short edge (which IS the height). Budget the whole cluster
    // against the height so the arithmetic cannot overflow a short screen.
    const budget = clamp(H * 0.26, 96, 260);   // total vertical room for controls
    const pad = clamp(budget * 0.07, 7, 20);
    const R = clamp((budget - pad * 2) / 2.20, 20, 62);
    const band = pad * 2 + R * 2.20;   // stick/fire row plus breathing room
    return { R, pad, band, W, H };
  }

  // The notch and home bar are real estate we cannot use. Read them from CSS env()
  // via a probe element so the HUD never sits under a camera cutout.
  readSafeInsets() {
    if (!this.mobile) return { top: 0, right: 0, bottom: 0, left: 0 };
    const d = document.documentElement;
    if (!d) return { top: 0, right: 0, bottom: 0, left: 0 };
    const cs = getComputedStyle(d);
    const px = (v) => {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : 0;
    };
    return {
      top: px(cs.getPropertyValue('--sat')),
      right: px(cs.getPropertyValue('--sar')),
      bottom: px(cs.getPropertyValue('--sab')),
      left: px(cs.getPropertyValue('--sal')),
    };
  }

  controlLayout() {
    const { R, pad, W, H } = this.controlBand();
    const sa = this.safe || { top: 0, right: 0, bottom: 0, left: 0 };
    const gap = R * 0.32;
    const fireR = R * 1.10;
    const dashR = R * 0.82;

    // A (fire) and B (dash) sit side by side under the right thumb, the way a
    // pad is laid out: the primary action is the biggest target on screen, the
    // secondary sits next to it and is clearly smaller.
    const bx = pad + sa.left, br = pad + sa.right, bt = pad + sa.top, bb = pad + sa.bottom;
    const stick = { x: bx + R, y: H - bb - R, r: R };
    const fire  = { x: W - br - fireR, y: H - bb - R, r: fireR };
    const dash  = { x: fire.x - fireR - gap - dashR, y: H - bb - R, r: dashR };
    // mode + gyro sit in the band just above the controls, never on top of the fight
    const mode  = { x: W - br - R * 0.62, y: H - bb - R * 2 - gap - R * 0.30, r: R * 0.62 };
    const pause = { x: W - br - R * 0.52, y: bt + R * 0.62, r: R * 0.52 };
    const gyro  = { x: bx + R * 0.52, y: bt + R * 0.62, r: R * 0.52 };
    return { R, pad, stick, dash, fire, mode, pause, gyro, W, H };
  }

  // generous hit radius: +14px of slop so thumbs forgive
  hit(cx, cy, btn) {
    if (!btn) return false;
    return (cx - btn.x) ** 2 + (cy - btn.y) ** 2 < (btn.r + 14) ** 2;
  }

  drawTouchControls(s, input) {
    if (!this.mobile) return;
    const c = this.ctx;
    const L = this.controlLayout();
    const auto = s.fireMode === 'auto';
    const hostile = s.player.hp <= 0;

    // ---------- movement stick (bottom-left) ----------
    c.save();
    c.globalAlpha = 0.5;
    c.strokeStyle = 'rgba(110,245,255,0.55)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.stick.x, L.stick.y, L.stick.r, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = 0.10;
    c.fillStyle = '#6ff5ff';
    c.beginPath(); c.arc(L.stick.x, L.stick.y, L.stick.r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.8;
    const kx = L.stick.x + (input.ax || 0) * L.stick.r * 0.6;
    const ky = L.stick.y + (input.ay || 0) * L.stick.r * 0.6;
    c.fillStyle = 'rgba(110,245,255,0.9)';
    c.beginPath(); c.arc(kx, ky, L.stick.r * 0.32, 0, Math.PI * 2); c.fill();
    c.restore();

    // ---------- A: fire / shoot ----------
    c.save();
    const aOn = input.fire || auto;
    c.globalAlpha = aOn ? 0.95 : 0.6;
    c.strokeStyle = hostile ? 'rgba(255,59,92,0.9)' : (auto ? '#7dffb2' : '#ffd166');
    c.lineWidth = 3;
    c.beginPath(); c.arc(L.fire.x, L.fire.y, L.fire.r, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = aOn ? 0.30 : 0.12;
    c.fillStyle = hostile ? '#ff3b5c' : (auto ? '#7dffb2' : '#ffd166');
    c.beginPath(); c.arc(L.fire.x, L.fire.y, L.fire.r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.95;
    c.fillStyle = auto ? '#c8ffdc' : '#ffe9b8';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.fire.r * 0.62)}px ui-monospace, Menlo, monospace`;
    c.fillText('A', L.fire.x, L.fire.y + L.fire.r * 0.22);
    c.globalAlpha = 0.55;
    c.font = `700 ${Math.round(L.fire.r * 0.22)}px ui-monospace, Menlo, monospace`;
    c.fillText(auto ? 'AUTO' : 'FIRE', L.fire.x, L.fire.y + L.fire.r * 0.72);
    // charge ring = how many shots the budget allows
    const afford = Math.max(0, Math.floor(s.player.hp - 3));
    c.globalAlpha = 0.85;
    c.strokeStyle = hostile ? '#ff3b5c' : (auto ? '#7dffb2' : '#6ff5ff');
    c.lineWidth = 3.5;
    c.beginPath();
    c.arc(L.fire.x, L.fire.y, L.fire.r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, afford / 8));
    c.stroke();
    c.restore();

    // ---------- B: dash ----------
    const ready = s.player.dashCd <= 0;
    c.save();
    c.globalAlpha = ready ? 0.85 : 0.32;
    c.strokeStyle = '#9ffcff';
    c.lineWidth = 3;
    c.beginPath(); c.arc(L.dash.x, L.dash.y, L.dash.r, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = ready ? 0.16 : 0.05;
    c.fillStyle = '#9ffcff';
    c.beginPath(); c.arc(L.dash.x, L.dash.y, L.dash.r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.95;
    c.fillStyle = '#d8feff';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.dash.r * 0.62)}px ui-monospace, Menlo, monospace`;
    c.fillText('B', L.dash.x, L.dash.y + L.dash.r * 0.22);
    c.globalAlpha = 0.55;
    c.font = `700 ${Math.round(L.dash.r * 0.22)}px ui-monospace, Menlo, monospace`;
    c.fillText('DASH', L.dash.x, L.dash.y + L.dash.r * 0.72);
    c.restore();

    // ---------- mode toggle (top-right of the fire stack) ----------
    c.save();
    c.globalAlpha = 0.9;
    c.strokeStyle = auto ? '#7dffb2' : '#ffd166';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.mode.x, L.mode.y, L.mode.r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = auto ? '#7dffb2' : '#ffd166';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.mode.r * 0.5)}px ui-monospace, Menlo, monospace`;
    c.fillText(auto ? 'AUTO' : 'AIM', L.mode.x, L.mode.y + L.mode.r * 0.18);
    c.restore();

    // ---------- pause (top-right corner) ----------
    c.save();
    c.globalAlpha = 0.75;
    c.strokeStyle = '#9ffcff';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.pause.x, L.pause.y, L.pause.r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = '#9ffcff';
    const bw = L.pause.r * 0.22, bh = L.pause.r * 0.7;
    c.fillRect(L.pause.x - bw * 1.6, L.pause.y - bh / 2, bw, bh);
    c.fillRect(L.pause.x + bw * 0.6, L.pause.y - bh / 2, bw, bh);
    c.restore();

    // ---------- gyro toggle (top-left corner, hidden without a sensor) ----------
    if (!this.gyroAvailable) { return; }
    c.save();
    c.globalAlpha = this.gyroOn ? 0.95 : 0.55;
    c.strokeStyle = this.gyroOn ? '#7dffb2' : 'rgba(160,190,215,0.8)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.gyro.x, L.gyro.y, L.gyro.r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = this.gyroOn ? '#7dffb2' : '#9fb6cf';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.gyro.r * 0.55)}px ui-monospace, Menlo, monospace`;
    c.fillText('GYRO', L.gyro.x, L.gyro.y + L.gyro.r * 0.18);
    c.restore();
  }

  // First-run instructions. Shown over the title screen and dismissed by the first
  // real input, so it never blocks anyone. On a phone the copy talks about A/B and
  // tilting; on a PC it talks about mouse and keys. Same overlay, right language.
  drawInstructions(s, alpha) {
    if (alpha <= 0) return;
    const c = this.ctx;
    const W = this.worldW, H = this.worldH;
    const mob = this.mobile;
    c.save();
    c.globalAlpha = alpha;

    const pad = mob ? 18 : 40;
    const panelW = Math.min(W - pad * 2, mob ? 340 : 520);
    const lines = mob
      ? [
          ['HOW TO PLAY', ''],
          ['LEFT THUMB', 'move'],
          ['RIGHT THUMB', 'A fire · B dash'],
          ['DRAG THE SCREEN', 'aim by touching'],
          ['A (big)', 'fire'],
          ['B (small)', 'dash'],
          ['GYRO', 'tilt to move (top-left)'],
          ['', ''],
          ['YOUR HP IS YOUR AMMO', ''],
          ['Every shot costs 1 PULSE', ''],
          ['Every kill pays it back', ''],
          ['Clear the quota before the clock runs out', ''],
          ['', ''],
          ['TAP ANYWHERE TO BEGIN', ''],
        ]
      : [
          ['HOW TO PLAY', ''],
          ['W A S D', 'move'],
          ['MOUSE', 'aim'],
          ['LEFT CLICK / SPACE', 'fire'],
          ['SHIFT', 'dash'],
          ['P', 'pause'],
          ['TAB', 'switch mode'],
          ['', ''],
          ['YOUR HP IS YOUR AMMO', ''],
          ['Every shot costs 1 PULSE', ''],
          ['Every kill pays it back', ''],
          ['Clear the quota before the clock runs out', ''],
          ['', ''],
          ['CLICK ANYWHERE TO BEGIN', ''],
        ];

    const rowH = mob ? 19 : 22;
    const panelH = lines.length * rowH + (mob ? 30 : 38);
    const x = W / 2 - panelW / 2;
    const y = H / 2 - panelH / 2;

    // dim the arena behind it
    c.fillStyle = `rgba(4,5,10,${0.82 * alpha})`;
    c.fillRect(0, 0, W, H);

    c.fillStyle = 'rgba(8,14,24,0.97)';
    c.strokeStyle = 'rgba(110,245,255,0.45)';
    c.lineWidth = 1.5;
    roundRect(c, x, y, panelW, panelH, 12);
    c.fill(); c.stroke();

    let ty = y + (mob ? 26 : 30);
    const left = x + (mob ? 16 : 24);
    const right = x + panelW - (mob ? 16 : 24);
    for (const [key, val] of lines) {
      if (key === 'HOW TO PLAY' || key === 'YOUR HP IS YOUR AMMO' || key.startsWith('TAP') || key.startsWith('CLICK')) {
        c.textAlign = 'center';
        c.font = `800 ${mob ? 13 : 15}px ui-monospace, Menlo, monospace`;
        c.fillStyle = key === 'HOW TO PLAY' ? '#9ffcff' : key.startsWith('TAP') || key.startsWith('CLICK') ? '#7dffb2' : '#ffd166';
        c.fillText(key, W / 2, ty);
        ty += rowH;
        continue;
      }
      if (key === '' && val === '') { ty += rowH * 0.45; continue; }
      c.textAlign = 'left';
      c.font = `800 ${mob ? 10 : 11}px ui-monospace, Menlo, monospace`;
      c.fillStyle = '#dff6ff';
      c.fillText(key, left, ty);
      c.textAlign = 'right';
      c.font = `400 ${mob ? 10 : 11}px ui-monospace, Menlo, monospace`;
      c.fillStyle = 'rgba(190,215,240,0.8)';
      c.fillText(val, right, ty);
      ty += rowH;
    }
    c.restore();
  }

  // Portrait is fully playable; landscape is simply better. This hint is
  // dismissible and never blocks input, because on iPhone the browser cannot
  // lock orientation at all — a blocking rotate screen would just lose players.
  drawRotateHint() {
    if (!this.mobile || !this.portrait || this.rotateHintDismissed) return;
    const c = this.ctx;
    const W = this.uiW, H = this.uiH;
    c.save();
    const w = Math.min(W - 24, 330), h = 54;
    const x = (W - w) / 2, y = H - h - 76;
    c.globalAlpha = 0.96;
    c.fillStyle = 'rgba(8,16,28,0.95)';
    c.strokeStyle = 'rgba(110,245,255,0.45)';
    c.lineWidth = 1.5;
    roundRect(c, x, y, w, h, 10);
    c.fill(); c.stroke();

    // little landscape glyph
    c.strokeStyle = '#9ffcff';
    c.lineWidth = 1.8;
    c.strokeRect(x + 14, y + 20, 22, 14);

    c.textAlign = 'left';
    c.font = '800 12px ui-monospace, Menlo, monospace';
    c.fillStyle = '#eafcff';
    c.fillText('BEST PLAYED SIDEWAYS', x + 46, y + 24);
    c.font = '400 10px ui-monospace, Menlo, monospace';
    c.fillStyle = 'rgba(170,200,225,0.8)';
    c.fillText('portrait works too · tap to hide this', x + 46, y + 39);
    this._rotateHint = { x, y, w, h };
    c.restore();
  }

  drawTitle(s) {
    const c = this.ctx;
    const W = this.uiW, H = this.uiH;
    const mob = this.mobile;
    const k = mob ? 0.44 : 1;          // text scale
    const cx = W / 2;
    const cy = H * (mob ? 0.36 : 0.34);
    c.save();
    c.textAlign = 'center';

    // logo
    c.font = `800 ${Math.round(104 * (mob ? 0.52 : 1))}px ui-monospace, Menlo, monospace`;
    c.fillStyle = '#eafcff';
    c.shadowColor = 'rgba(110,245,255,0.85)';
    c.shadowBlur = 42;
    c.fillText('OVERDRAFT', cx, cy);

    // glitch ghosts
    c.globalCompositeOperation = 'lighter';
    const j = Math.sin(this.t * 2.3) * 3;
    c.globalAlpha = 0.25;
    c.fillStyle = '#ff2d55'; c.shadowBlur = 0;
    c.fillText('OVERDRAFT', cx + 3 + j, cy);
    c.fillStyle = '#00e5ff';
    c.fillText('OVERDRAFT', cx - 3 + j * 0.5, cy);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';

    c.shadowBlur = 0;
    c.font = `700 ${Math.round(20 * (mob ? 0.8 : 1))}px ui-monospace, Menlo, monospace`;
    c.fillStyle = 'rgba(210,235,255,0.92)';
    c.fillText('YOUR HEALTH BAR IS THE MAGAZINE.', cx, cy + 46 * (mob ? 0.7 : 1));

    c.font = `400 ${Math.round(15 * (mob ? 0.85 : 1))}px ui-monospace, Menlo, monospace`;
    c.fillStyle = 'rgba(160,190,215,0.72)';
    c.fillText('Every shot costs 1 PULSE. Every kill pays it back.', cx, cy + (mob ? 78 : 82));
    c.fillStyle = 'rgba(255,95,109,0.85)';
    c.fillText(mob ? 'Nine levels. Each one adds a rule.' : 'Nine levels, each with a new rule. Clear the quota before the clock.', cx, cy + (mob ? 100 : 106));

    // pulse bar preview
    const segW = mob ? 18 : 30, gap = mob ? 3 : 5, n = 11;
    const bw = n * segW + (n - 1) * gap;
    const bx = cx - bw / 2;
    const by = cy + (mob ? 126 : 136);
    for (let i = 0; i < n; i++) {
      const isNeg = i >= MAX_PULSE;
      c.save();
      if (isNeg) { c.strokeStyle = 'rgba(255,45,85,0.55)'; c.strokeRect(bx + i * (segW + gap) + 0.5, by + 0.5, segW, 14); }
      else {
        c.fillStyle = 'rgba(110,245,255,0.28)';
        c.fillRect(bx + i * (segW + gap), by, segW, 14);
      }
      c.restore();
    }
    c.font = '700 10px ui-monospace, Menlo, monospace';
    c.fillStyle = 'rgba(160,190,215,0.5)';
    c.textAlign = 'right';
    c.fillText('CREDIT', bx + bw, by + 30);
    c.textAlign = 'left';
    c.fillStyle = 'rgba(110,245,255,0.55)';
    c.fillText('PULSE', bx, by + 30);

    // call to action
    const blink = (Math.sin(this.t * 3.4) + 1) / 2;
    c.textAlign = 'center';
    c.globalAlpha = 0.55 + blink * 0.45;
    c.font = `800 ${Math.round(22 * (mob ? 0.82 : 1))}px ui-monospace, Menlo, monospace`;
    c.fillStyle = '#9ffcff';

    input.dash = input.dash || keys.has('shift') || (keys.has(' ') && state.mode === 'play');
  }

  // a real pause: stop accumulating time so the sim cannot advance at all
  if (paused) { acc = 0; renderer.draw(state, mouse, dt); drawPause(); return; }

  while (acc >= FIXED) {
    let stepInput = input;
    if (DEMO && state.mode === 'play') stepInput = demoInput(state);
    step(state, FIXED, stepInput);
    acc -= FIXED;
    input.dash = false;
    handleEvents();
  }

  if (state.mode === 'dead') state.deadT += dt;

  // respect the OS "reduce motion" setting: halve shake, keep the game readable
  if (REDUCE_MOTION && state.shake > 6) state.shake = 6;
  renderer.gyroAvailable = !!gyro.supported;
  renderer.draw(state, mouse, dt);
  if (state.mode === 'play' && renderer.mobile) {
    renderer.ctx.save();
    renderer.ctx.translate(renderer.ox, renderer.oy);
    renderer.ctx.scale(renderer.scale, renderer.scale);
    renderer.drawTouchControls(state, input);
    renderer.ctx.restore();
  }
  if (!helpDismissed && helpAlpha > 0) helpAlpha = Math.max(1.6, helpAlpha - dt * 0.55);
  if (!helpDismissed && helpAlpha > 0) {
    renderer.ctx.save();
    renderer.ctx.translate(renderer.ox, renderer.oy);
    renderer.ctx.scale(renderer.scale, renderer.scale);
    // gentle fade: full for a moment, then out
    const a = Math.min(1, Math.max(0, helpAlpha / 1.6));
    renderer.drawInstructions(state, a);
    renderer.ctx.restore();
  }
  if (paused) drawPause();

  // fps badge (dev only via ?debug=1)
  frames++; fpsT += dt;
  if (params.get('debug') === '1' && fpsT > 0.5) {
    const c = renderer.ctx;
    c.save();
    c.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
    c.font = '11px monospace';
    c.fillStyle = '#4ade80';
    c.fillText(`${Math.round(frames / fpsT)} fps · ${state.enemies.length} ent`, 8, 14);
    c.restore();
    frames = 0; fpsT = 0;
  }
}

let overdraftOn = false;
function handleEvents() {
  const over = state.player.hp <= 0 && state.mode !== 'title';
  if (over && !overdraftOn) { sfx.overdraftOn(); overdraftOn = true; }
  if (!over && overdraftOn) { sfx.overdraftOff(); overdraftOn = false; }

  for (const ev of state.events) {
    switch (ev.type) {
      case 'shoot': sfx.shoot(ev.over, Math.max(0, state.player.hp)); break;
      case 'hit': sfx.hit(); break;
      case 'kill': sfx.kill(); if (ev.refund != null) sfx.refund(ev.refund); buzz(9); break;
      case 'overdraftKill': sfx.orb(); toast('REPAID'); break;
      case 'hurt': sfx.hurt(); buzz(38); break;
      case 'dash': sfx.dash(); break;
      case 'wave': sfx.wave(); break;
      case 'levelClear': sfx.levelClear(); break;
      case 'levelFail': sfx.levelFail(); break;
      case 'clang': sfx.clang(); break;
      case 'crack': sfx.hit(); break;
      case 'retry': break;
      case 'card': toast(ev.name); break;
    }
  }
  // heartbeat when critical (non-overdraft, low pulse)
  // music: only while actually fighting, never on the title or the death card
  const wantMusic = state.mode === 'play' && !paused;
  if (wantMusic && !sfx._music) sfx.startMusic();
  if (!wantMusic && sfx._music) sfx.stopMusic();
  if (state.mode === 'play' && state.player.hp > 0 && state.player.hp <= 1.5) {
    hbT -= FIXED;
    if (hbT <= 0) { sfx.heartbeat(0.7); hbT = 0.75; }
  }
}
let hbT = 0;

// Haptics: only on devices that have them, and never if the player asked for
// reduced motion (which on iOS is the closest proxy for 'don't buzz me').
function buzz(ms) {
  if (!renderer.mobile) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch {} }
}

// Pause overlay with real buttons. The old one only said "press P to resume",
// which is useless on a phone: there is no P key, and nothing on screen told you
// the pause circle would toggle it back. Now every option is a thumb-sized target.
// Return to the title/mode-select screen. This route did not exist before: a run
// could only ever restart, never go back to choose a mode.
function toTitle() {
  clearInputState();
  paused = false;
  state.mode = 'title';
  state.levelState = 'fight';
  state.pick = null;
  state.enemies.length = 0;
  state.bullets.length = 0;
  state.particles.length = 0;
  state.level = 1;
  state.wave = 1;
  state._lv = levelFor(1);
  state.levelKills = 0;
  state.levelT = 0;
  state.score = 0;
  state.kills = 0;
  state.shotsFired = 0;
  state.shotsHit = 0;
  state.levelsCleared = 0;
  state.retries = 0;
  state.cardsTaken = [];
  state.player.hp = state.player.maxHp;
  state.player.x = state.world.w / 2;
  state.player.y = state.world.h / 2;
  last = performance.now();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function pauseButtons() {
  const c = renderer.ctx;
  const w = canvas.width / renderer.dpr, h = canvas.height / renderer.dpr;
  const mob = renderer.mobile;
  const bw = Math.min(mob ? 300 : 320, w - 48);
  const bh = mob ? 54 : 50;
  const gap = 14;
  const cx = w / 2;
  const top = h / 2 - 30;
  return [
    { id: 'resume',  label: 'RESUME',            x: cx - bw / 2, y: top,                w: bw, h: bh, tone: '#7dffb2' },
    { id: 'restart', label: 'RESTART RUN',       x: cx - bw / 2, y: top + bh + gap,     w: bw, h: bh, tone: '#ffd166' },
    { id: 'menu',    label: 'MAIN MENU',         x: cx - bw / 2, y: top + (bh + gap) * 2, w: bw, h: bh, tone: '#6ff5ff' },
  ];
}

function drawPause() {
  const c = renderer.ctx;
  c.save();
  c.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
  const w = canvas.width / renderer.dpr, h = canvas.height / renderer.dpr;
  c.fillStyle = 'rgba(4,5,10,0.86)';
  c.fillRect(0, 0, w, h);

  c.textAlign = 'center';
  c.fillStyle = '#9ffcff';
  c.font = `800 ${renderer.mobile ? 30 : 34}px ui-monospace, monospace`;
  c.fillText('PAUSED', w / 2, h / 2 - 78);
  c.font = '400 12px ui-monospace, monospace';
  c.fillStyle = 'rgba(160,190,215,0.6)';
  c.fillText(renderer.mobile ? 'the run is frozen, nothing is lost' : 'press P to resume', w / 2, h / 2 - 52);

  for (const b of pauseButtons()) {
    c.globalAlpha = 1;
    c.fillStyle = 'rgba(12,20,34,0.96)';
    c.strokeStyle = b.tone;
    c.lineWidth = 1.6;
    roundRect(c, b.x, b.y, b.w, b.h, 12);
    c.fill(); c.stroke();
    c.fillStyle = b.tone;
    c.font = `800 ${renderer.mobile ? 16 : 15}px ui-monospace, monospace`;
    c.textAlign = 'center';
    c.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
  }
  c.restore();
}

// Is a point inside one of the pause buttons? Used by the pointer handler.
function pauseHit(px, py) {
  for (const b of pauseButtons()) {
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.id;
  }
  return null;
}

// tiny transient toast
let toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 1.1; }
(function toastLoop() {
  if (toastT > 0) {
    const c = renderer.ctx;
    c.save();
    c.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
    const w = canvas.width / renderer.dpr, h = canvas.height / renderer.dpr;
    c.globalAlpha = Math.min(1, toastT * 2);
    c.font = '700 12px ui-monospace, monospace';
    c.fillStyle = '#ffd166';
    c.textAlign = 'center';
    c.fillText(toastMsg, w / 2, h - 24);
    c.restore();
  }
  requestAnimationFrame(toastLoop);
})();

// resize canvas backing store on orientation change
function syncWorld() {
  renderer.resize();
  sim_setWorld(state, renderer.worldW, renderer.worldH);
  state.aimAssist = renderer.mobile ? 0.34 : 0;
  state.touchUi = !!renderer.mobile;
  const p = state.player;
  p.x = Math.min(p.x, renderer.worldW - 24);
  p.y = Math.min(p.y, renderer.worldH - 24);
}
window.addEventListener('orientationchange', () => setTimeout(syncWorld, 150));
window.addEventListener('resize', () => syncWorld());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => syncWorld());

if (AUTOSTART) { clearInputState(); startRun(state); }
requestAnimationFrame(frame);

// test / automation hooks
window.__OVERDRAFT = {
  state,
  get paused() { return paused; },
  pauseHit,
  pauseButtons,
  start: () => startRun(state),
  step: (n, inp) => { for (let i = 0; i < n; i++) step(state, 1 / 60, inp || input); },
  renderer,
};

})();
})();
</script>
</body>
</html>
