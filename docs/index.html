<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>OVERDRAFT — your health bar is the magazine</title>
<meta name="description" content="OVERDRAFT is a top-down arena shooter where every bullet is paid for with your own health. Kill to earn it back." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060a;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; touch-action: none; outline: none;
    image-rendering: auto;
    max-width: 100%; max-height: 100%;
  }
  /* CRT scanlines + soft edge vignette over the whole stage */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode: multiply;
    opacity: .75;
  }
  #credit {
    position: fixed; bottom: 6px; right: 10px; z-index: 11;
    font-size: 10px; letter-spacing: .12em; color: #3a4152; pointer-events: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
  <div id="crt"></div>
  <div id="credit">OVERDRAFT · vertical slice · made with AI</div>
  <script>
(() => {
'use strict';
const __sim = (() => {

// OVERDRAFT — pure simulation. No DOM, no canvas, no audio.
// Runs identically in the browser and in Node (used by the headless balance tests).
//
// CORE RULE: your health bar IS your magazine.
//   - Every shot spends 1 PULSE.
//   - Taking a hit spends 2-3 PULSE and knocks you back.
//   - Every kill refunds PULSE (more than a kill costs you, if you don't miss).
//   - At 0 PULSE you enter OVERDRAFT: you may keep firing on credit down to -3.
//   - In overdraft a kill refunds 1.5x. You are always one bad hit from death.
// So: accuracy is survival. Missing is the only way to lose health for free.

// Default world is landscape; setWorld() reshapes it (portrait phones, etc.)
const W = 1280;
const H = 720;
const MIN_W = 320;
const MIN_H = 480;
// reference size the gameplay numbers were tuned against
const REF_MIN = 720;
const MAX_PULSE = 8;
const OVERDRAFT_FLOOR = -3;
const STEP = 1 / 60;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

const ENEMY_TYPES = {
  scrapper: { r: 13, hp: 1, speed: 108, dmg: 2, refund: 2, score: 100, color: '#ff5f6d' },
  drifter:  { r: 17, hp: 2, speed: 76,  dmg: 2, refund: 2, score: 150, color: '#ffa14a' },
  lancer:   { r: 15, hp: 2, speed: 58,  dmg: 1, refund: 2, score: 200, color: '#c46bff' },
  brute:    { r: 30, hp: 6, speed: 52,  dmg: 3, refund: 4, score: 400, color: '#ff2d55' },
};

// The two modes are not a difficulty slider. They change the rules:
//
//   MANUAL (marksman) - you aim. Shots cost 1 PULSE, kills refund 2, and a shot
//     that hits nothing ricochets off the wall and comes back at you. Precision
//     is the whole game: accuracy IS your ammo supply.
//
//   AUTO (turret)     - the gun aims and fires itself at the nearest target.
//     You only position and dash. Shots still cost PULSE but kills refund less,
//     and misses do NOT ricochet (the turret rarely misses). The economy is
//     tighter and there is no precision to save you, so RUNNING OUT is the real
//     threat. You are managing a budget, not an aim.
const FIRE_MODES = {
  manual: {
    id: 'manual', name: 'MARKSMAN', blurb: 'You aim. Misses ricochet back at you.',
    // accurate play is genuinely harder here, so a hit pays more
    cost: 1, refund: 2, ricochet: true, fireRate: 0.17, autoAim: false, assist: true,
  },
  auto: {
    id: 'auto', name: 'TURRET', blurb: 'Auto-fire. Position and dash. No aim, thinner budget.',
    cost: 1, refund: 1, ricochet: false, fireRate: 0.24, autoAim: true, assist: false,
  },
};

const CARDS = [
  { id: 'surplus',  name: 'SURPLUS',      desc: '+3 max PULSE, topped up now.',        apply: (s) => { s.player.maxHp += 3; s.player.hp = s.player.maxHp; } },
  { id: 'vampire',  name: 'VAMPIRE',      desc: 'Kills refund +1 PULSE.',              apply: (s) => { s.mods.refundBonus += 1; } },
  { id: 'quick',    name: 'QUICK HANDS',  desc: 'Fire rate +35%.',                     apply: (s) => { s.mods.fireRate *= 1.35; } },
  { id: 'pierce',   name: 'RICOCHET',     desc: 'Shots pass through 1 extra enemy.',   apply: (s) => { s.mods.pierce += 1; } },
  { id: 'ghost',    name: 'GHOST STEP',   desc: 'Dash cooldown -40%, longer i-frames.', apply: (s) => { s.mods.dashCd *= 0.6; s.mods.iFrames += 0.15; } },
  { id: 'thrift',   name: 'THRIFT',       desc: 'Every 4th shot is free.',             apply: (s) => { s.mods.freeEvery = 4; } },
];

function createState(seed = 1) {
  const rng = mulberry32(seed);
  return {
    rng,
    time: 0,
    mode: 'title', // title | play | pick | dead
    world: { w: W, h: H },
    es: 1,            // entity scale: keeps the game readable on small screens
    aimAssist: 0,     // radians of snap-assist (touch only)
    fireMode: 'auto', // 'auto' (turret) | 'manual' (marksman) - different rules, see below
    autoTarget: null, // id of the enemy the turret is tracking
    player: {
      x: W / 2, y: H / 2, vx: 0, vy: 0, r: 15,
      aim: -Math.PI / 2,
      hp: MAX_PULSE, maxHp: MAX_PULSE,
      fireCd: 0, dashCd: 0, dashT: 0, invuln: 0,
      lastShot: -99, lastHurt: -99,
      alive: true, hitFlash: 0, shotCount: 0,
    },
    mods: { fireRate: 1, pierce: 0, refundBonus: 0, dashCd: 1.15, iFrames: 0.28, freeEvery: 0 },
    bullets: [],
    enemies: [],
    particles: [],
    floaters: [],
    wallMarks: [],
    events: [],
    wave: 1,
    waveT: 0,
    waveLen: 22,
    spawnT: 1.2,
    kills: 0,
    streak: 0,
    streakT: 0,
    bestStreak: 0,
    score: 0,
    shotsFired: 0,
    shotsHit: 0,
    damageTaken: 0,
    shake: 0,
    hitstop: 0,
    slowmo: 0,
    flashRed: 0,
    pick: null,
    cardsTaken: [],
    nextId: 1,
    deadT: 0,
    lastKill: -99,
  };
}

function emit(s, type, data = {}) { s.events.push({ type, ...data }); }

// Reshape the arena. Keeps entities inside the new bounds and pulls the player
// toward the middle so a rotation never traps them in a wall.
function setWorld(s, w, h) {
  s.world.w = clamp(Math.round(w), MIN_W, 4000);
  s.world.h = clamp(Math.round(h), MIN_H, 4000);
  // One scale for everything that moves, so a 390px phone plays like the 1280px build.
  s.es = clamp(Math.min(s.world.w, s.world.h) / REF_MIN, 0.62, 1.25);
  s.player.r = 15 * s.es;
  const p = s.player;
  p.x = clamp(p.x, 24, s.world.w - 24);
  p.y = clamp(p.y, 24, s.world.h - 24);
  for (const e of s.enemies) {
    e.x = clamp(e.x, -40, s.world.w + 40);
    e.y = clamp(e.y, -40, s.world.h + 40);
  }
}

function startRun(s) {
  const world = { w: s.world.w, h: s.world.h };
  const fresh = createState(Math.floor(s.rng() * 1e9));
  Object.assign(s, fresh, { mode: 'play', world });
  // start the player in the middle of *this* screen
  setWorld(s, world.w, world.h);
  s.player.x = world.w / 2;
  s.player.y = world.h / 2;
  emit(s, 'start');
  return s;
}

// ---------------------------------------------------------------------------
// input: { ax, ay, aimX, aimY, fire, dash }
function step(s, dt, input) {
  s.events.length = 0;
  if (s.mode !== 'play') { s.time += dt; return s; }

  if (s.hitstop > 0) { s.hitstop -= dt; s.shake = Math.max(0, s.shake - dt * 40); return s; }

  s.time += dt;
  s.waveT += dt;
  const p = s.player;
  const es = s.es;

  // ---- waves ---------------------------------------------------------------
  if (s.waveT >= s.waveLen) {
    s.waveT = 0;
    s.wave += 1;
    s.waveLen = Math.max(14, 22 - s.wave * 0.7);
    s.player.hp = Math.min(p.maxHp, p.hp + 1);
    emit(s, 'wave', { wave: s.wave });
    if (s.wave % 3 === 0 && s.cardsTaken.length < 3) openCardPick(s);
  }

  // ---- player movement -----------------------------------------------------
  const ax = input.ax || 0, ay = input.ay || 0;
  const mag = Math.hypot(ax, ay) || 1;
  const nx = ax / mag, ny = ay / mag;
  const speed = 335 * es;
  const accel = 14;
  if (p.dashT > 0) {
    p.dashT -= dt;
    p.invuln = Math.max(p.invuln, 0.05);
  } else {
    p.vx += (nx * speed * (ax || ay ? 1 : 0) - p.vx) * Math.min(1, accel * dt);
    p.vy += (ny * speed * (ax || ay ? 1 : 0) - p.vy) * Math.min(1, accel * dt);
  }
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt * 4);

  if (input.dash && p.dashCd <= 0) {
    const dx = ax || ay ? nx : Math.cos(p.aim);
    const dy = ax || ay ? ny : Math.sin(p.aim);
    p.vx = dx * 1100 * es; p.vy = dy * 1100 * es;
    p.dashT = 0.15;
    p.dashCd = s.mods.dashCd;
    p.invuln = s.mods.iFrames;
    emit(s, 'dash');
    for (let i = 0; i < 10; i++) spawnParticle(s, p.x, p.y, '#6ff5ff', 120);
  }

  p.x += p.vx * dt; p.y += p.vy * dt;
  const m = 24;
  const ww = s.world.w, wh = s.world.h;
  if (p.x < m) { p.x = m; p.vx *= -0.4; }
  if (p.x > ww - m) { p.x = ww - m; p.vx *= -0.4; }
  if (p.y < m) { p.y = m; p.vy *= -0.4; }
  if (p.y > wh - m) { p.y = wh - m; p.vy *= -0.4; }

  // aim: a thumb cannot reach under the control pads, so clamp the REQUESTED
  // point (not the resolved shot angle) into the reachable area. Only when the
  // on-screen pads are actually there — on desktop this would corrupt aim.
  if (input.aimX != null) {
    let tx = input.aimX, ty = input.aimY;
    const limitY = s.world.h - 170 * es;
    if (s.touchUi && ty > limitY) ty = limitY;
    const dx0 = tx - p.x, dy0 = ty - p.y;
    if (Math.abs(dx0) + Math.abs(dy0) > 8) p.aim = Math.atan2(dy0, dx0);
  }

  // ---- NO PASSIVE REGEN ----
  // PULSE only comes back from kills. Standing still and dodging cannot heal you,
  // so running away is never a strategy: if you stop shooting, you only bleed.

  // ---- shooting ------------------------------------------------------------
  p.fireCd -= dt;
  const over = p.hp <= 0;
  const mode = FIRE_MODES[s.fireMode] || FIRE_MODES.manual;

  // TURRET mode: the gun aims itself. Pick the nearest enemy, aim at it, and
  // fire automatically. The player's job becomes positioning, not precision.
  let fireWanted = input.fire;
  if (mode.autoAim) {
    let tgt = null, bestD = Infinity;
    for (const e of s.enemies) {
      if (e.dead || e.spawnT > 0) continue;
      const d2e = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
      if (d2e < bestD) { bestD = d2e; tgt = e; }
    }
    if (tgt) {
      // lead the target slightly, and snap the aim so the turret reads as a machine
      p.aim = Math.atan2(tgt.y + tgt.vy * 0.06 - p.y, tgt.x + tgt.vx * 0.06 - p.x);
      s.autoTarget = tgt.id;
      // hold fire unless the budget is about to run dry (it defends itself)
      fireWanted = p.hp > 0.6;
    } else {
      s.autoTarget = null;
      fireWanted = false;
    }
  } else {
    s.autoTarget = null;
  }

  if (fireWanted && p.fireCd <= 0 && p.hp > OVERDRAFT_FLOOR) {
    const fm = FIRE_MODES[s.fireMode] || FIRE_MODES.manual;
    const free = s.mods.freeEvery > 0 && p.shotCount > 0 && p.shotCount % s.mods.freeEvery === 0;
    const cost = free ? 0 : fm.cost;
    // You cannot fire the shot that would push you past the floor.
    if (p.hp - cost > OVERDRAFT_FLOOR) {
      p.hp -= cost;
      p.shotCount++;
      s.shotsFired++;
      p.fireCd = fm.fireRate / s.mods.fireRate;
      p.lastShot = s.time;
      const spd = 1080 * es;
      const spread = 0.028;
      let aimAngle = p.aim;
      if (s.aimAssist > 0) {
        // 1) prefer the enemy nearest to the aim RAY (not merely angularly closest),
        //    so a thumb pointing roughly at a cluster hits what it is pointing at
        let rayBest = null, rayScore = Infinity;
        for (const e of s.enemies) {
          if (e.dead || e.spawnT > 0) continue;
          const dx = e.x - p.x, dy = e.y - p.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 640 * es || dist < 1) continue;
          let delta = Math.atan2(dy, dx) - p.aim;
          while (delta > Math.PI) delta -= Math.PI * 2;
          while (delta < -Math.PI) delta += Math.PI * 2;
          if (Math.abs(delta) > s.aimAssist * 1.6) continue;
          // perpendicular miss distance from the aim ray
          const perp = Math.abs(Math.sin(delta)) * dist;
          if (perp < rayScore) { rayScore = perp; rayBest = delta; }
        }
        if (rayBest !== null) {
          aimAngle = p.aim + rayBest;
        }
      }
      if (false) {
        let bestDelta = Infinity, bestDir = 0;
        for (const e of s.enemies) {
          if (e.dead) continue;
          const ddx = e.x - p.x, ddy = e.y - p.y;
          if (ddx * ddx + ddy * ddy > (620 * es) ** 2) continue;
          let delta = Math.atan2(ddy, ddx) - p.aim;
          while (delta > Math.PI) delta -= Math.PI * 2;
          while (delta < -Math.PI) delta += Math.PI * 2;
          if (Math.abs(delta) < s.aimAssist * 2.6 && Math.abs(delta) < Math.abs(bestDelta)) {
            bestDelta = delta;
          }
        }
        // snap almost all the way: touch aim should feel generous, not punishing
        if (bestDelta !== Infinity) aimAngle = p.aim + bestDelta * 0.96;
      }
      const a = aimAngle + (s.rng() - 0.5) * spread;
      s.bullets.push({
        x: p.x + Math.cos(a) * 20 * es, y: p.y + Math.sin(a) * 20 * es,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        r: 5 * es, life: 0.85, friendly: true, dmg: 1,
        pierce: s.mods.pierce, hitIds: [], trail: [], over, bounces: 1,
      });
      p.vx -= Math.cos(a) * 26 * es; p.vy -= Math.sin(a) * 26 * es;
      s.shake = Math.min(10, s.shake + (over ? 3.2 : 1.4));
      emit(s, 'shoot', { over });
      for (let i = 0; i < 4; i++) spawnParticle(s, p.x + Math.cos(a) * 18 * es, p.y + Math.sin(a) * 18 * es, over ? '#ff3b5c' : '#bffcff', 260 * es, a);
    } else {
      p.fireCd = 0.2;
      emit(s, 'click');
    }
  }

  // ---- spawn enemies -------------------------------------------------------
  s.spawnT -= dt;
  const aliveCap = 5 + s.wave * 2;
  if (s.spawnT <= 0 && s.enemies.length < aliveCap) {
    spawnEnemy(s);
    const pressure = clamp(1.55 - s.wave * 0.13, 0.32, 1.55);
    s.spawnT = pressure * (0.6 + s.rng() * 0.8);
  }

  // ---- bullets -------------------------------------------------------------
  for (let i = s.bullets.length - 1; i >= 0; i--) {
    const b = s.bullets[i];
    b.life -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.trail) { b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 4) b.trail.shift(); }
    // WALL BOUNCE: a shot that hits nothing ricochets and comes back at YOU.
    // This is the whole concept made physical — a miss does not just cost a pulse,
    // it returns as a threat you have to dodge. Your own accuracy is your ammo.
    const bw = s.world.w, bh = s.world.h, wallPad = 8;
    let bouncedX = false, bouncedY = false;
    const ricochetOn = (FIRE_MODES[s.fireMode] || FIRE_MODES.manual).ricochet;
    if (ricochetOn && b.friendly && b.bounces > 0) {
      if (b.x < wallPad) { b.x = wallPad; b.vx = Math.abs(b.vx); bouncedX = true; }
      else if (b.x > bw - wallPad) { b.x = bw - wallPad; b.vx = -Math.abs(b.vx); bouncedX = true; }
      if (b.y < wallPad) { b.y = wallPad; b.vy = Math.abs(b.vy); bouncedY = true; }
      else if (b.y > bh - wallPad) { b.y = bh - wallPad; b.vy = -Math.abs(b.vy); bouncedY = true; }
      if (bouncedX || bouncedY) {
        b.bounces--;
        b.friendly = false;          // now it can hurt you
        b.life = 2.4;
        b.vx *= 0.86; b.vy *= 0.86;   // loses energy off the wall
        emit(s, 'bounce');
        for (let k = 0; k < 9; k++) spawnParticle(s, b.x, b.y, k % 2 ? '#ff3b5c' : '#ffd166', 260 * es);
        if (!s.wallMarks) s.wallMarks = [];
        if (s.wallMarks.length < 24) s.wallMarks.push({ x: b.x, y: b.y, life: 2.5 });
      }
    }
    if (b.life <= 0 || b.x < -20 || b.x > bw + 20 || b.y < -20 || b.y > bh + 20) { s.bullets.splice(i, 1); continue; }

    if (b.friendly) {
      for (const e of s.enemies) {
        if (e.dead || b.hitIds.includes(e.id)) continue;
        // touch players get a wider hit radius: a thumb cannot be pixel-accurate,
        // and a near-miss that visually connects should count as a hit
        const grace = s.aimAssist > 0 ? 7 * es : 0;  // (touch only)
        const hitR = b.r + e.r + grace;
        if (dist2(b.x, b.y, e.x, e.y) < hitR * hitR) {
          e.hp -= b.dmg;
          e.hitFlash = 1;
          s.shotsHit++;
          b.hitIds.push(e.id);
          for (let k = 0; k < 6; k++) spawnParticle(s, b.x, b.y, e.color, 200);
          if (e.hp <= 0) killEnemy(s, e);
          else { emit(s, 'hit'); s.shake = Math.min(8, s.shake + 1); }
          if (b.hitIds.length > b.pierce) { s.bullets.splice(i, 1); }
          break;
        }
      }
    } else {
      if (p.invuln <= 0 && dist2(b.x, b.y, p.x, p.y) < (b.r + p.r) * (b.r + p.r)) {
        s.bullets.splice(i, 1);
        damagePlayer(s, 1);
      }
    }
  }

  // ---- enemies -------------------------------------------------------------
  for (let i = s.enemies.length - 1; i >= 0; i--) {
    const e = s.enemies[i];
    if (e.dead) { s.enemies.splice(i, 1); continue; }
    e.hitFlash = Math.max(0, e.hitFlash - dt * 5);
    e.spawnT = Math.max(0, (e.spawnT || 0) - dt);
    e.hitCd = Math.max(0, (e.hitCd || 0) - dt);
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;

    const want = 300 * es;
    if (e.type === 'lancer') {
      const push = d > want + 40 ? 1 : d < want - 40 ? -1 : 0;
      e.vx = (ux * e.speed * push + -uy * e.speed * 0.55) * es;
      e.vy = (uy * e.speed * push + ux * e.speed * 0.55) * es;
      e.fireCd -= dt;
      if (e.fireCd <= 0 && d < 620 * es) {
        e.fireCd = 1.9;
        const a = Math.atan2(dy, dx);
        s.bullets.push({
          x: e.x, y: e.y, vx: Math.cos(a) * 300 * es, vy: Math.sin(a) * 300 * es,
          r: 8 * es, life: 3.4, friendly: false, dmg: 1,
        });
        emit(s, 'enemyShoot');
      }
    } else if (e.type === 'drifter') {
      const wob = Math.sin(s.time * 2.4 + e.phase) * 0.75;
      e.vx = (ux + -uy * wob) * e.speed * es;
      e.vy = (uy + ux * wob) * e.speed * es;
    } else {
      const boost = (e.type === 'brute' ? 1.15 : 1 + Math.min(0.85, s.wave * 0.07)) * es;
      e.vx = ux * e.speed * boost;
      e.vy = uy * e.speed * boost;
    }
    e.x = clamp(e.x + e.vx * dt, -40, s.world.w + 40);
    e.y = clamp(e.y + e.vy * dt, -40, s.world.h + 40);

    if (e.spawnT <= 0 && e.hitCd <= 0 && p.invuln <= 0 && dist2(e.x, e.y, p.x, p.y) < (e.r + p.r) * (e.r + p.r)) {
      // Contact HURTS you and costs you ammo. It never kills the enemy.
      // The only way to remove an enemy from the field is a bullet.
      damagePlayer(s, e.dmg, e);
      const kb = (e.type === 'brute' ? 620 : 380) * es;
      p.vx += ux * kb; p.vy += uy * kb;
      for (let k = 0; k < 10; k++) spawnParticle(s, e.x, e.y, e.color, 320);
      // shove the enemy back too, so it can't sit inside you
      e.x += ux * -26; e.y += uy * -26;
      e.hitCd = 0.6;
    }
  }

  // separate enemies so they don't stack into one blob
  for (let i = 0; i < s.enemies.length; i++) {
    for (let j = i + 1; j < s.enemies.length; j++) {

    // muzzle flash: a brief bloom at the barrel sells the shot costing something
    if (s.time - p.lastShot < 0.07) {
      const k = 1 - (s.time - p.lastShot) / 0.07;
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = k * 0.9;
      const col = p.hp <= 0 ? '#ff3b5c' : '#bffcff';
      c.drawImage(glowSprite(col), p.x + Math.cos(p.aim) * 24 - 34, p.y + Math.sin(p.aim) * 24 - 34, 68, 68);
      c.restore();
    }

    // player bullets with trails
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const b of s.bullets) {
      if (!b.friendly) continue;
      const col = b.over ? '#ff3b5c' : '#6ff5ff';
      if (b.trail) {
        for (let i = 0; i < b.trail.length; i++) {
          const t = b.trail[i];
          const a = (i / b.trail.length) * 0.5;
          c.globalAlpha = a;
          c.drawImage(glowSprite(col), t.x - 11, t.y - 11, 22, 22);
        }
        c.globalAlpha = 1;
      }
      c.drawImage(glowSprite(col), b.x - 20, b.y - 20, 40, 40);
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(b.x, b.y, 3.4, 0, TAU); c.fill();
    }
    c.restore();

    // player
    this.drawPlayer(s);
  }

  angleOf(e) {
    const p = { x: 0, y: 0 };
    const a = Math.atan2(e.vy, e.vx);
    return Number.isFinite(a) ? a : 0;
  }

  drawPlayer(s) {
    const c = this.ctx;
    const p = s.player;
    const over = p.hp <= 0;
    const main = over ? '#ff3b5c' : '#6ff5ff';

    // heartbeat ring when in overdraft
    if (over) {
      const beat = (Math.sin(this.t * 5.4) + 1) / 2;
      c.save();
      c.globalAlpha = 0.35 + beat * 0.3;
      c.strokeStyle = 'rgba(255,60,90,0.8)';
      c.lineWidth = 2;
      c.beginPath();
      c.arc(p.x, p.y, 30 + beat * 16, 0, TAU);
      c.stroke();
      c.restore();
    }

    c.save();
    c.translate(p.x, p.y);
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = p.invuln > 0 && Math.floor(this.t * 20) % 2 ? 0.45 : 0.9;
    c.drawImage(glowSprite(main), -46, -46, 92, 92);
    c.restore();

    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.aim);
    const flick = p.hitFlash > 0 ? '#ffffff' : main;
    c.strokeStyle = flick;
    c.fillStyle = hexA(flick, 0.18);
    c.lineWidth = 2.6;
    c.lineJoin = 'round';
    // arrowhead hull
    c.beginPath();
    c.moveTo(18, 0); c.lineTo(-11, 12); c.lineTo(-5, 0); c.lineTo(-11, -12);
    c.closePath(); c.fill(); c.stroke();
    // muzzle
    c.beginPath(); c.moveTo(18, 0); c.lineTo(26, 0); c.stroke();
    // core
    c.beginPath(); c.arc(-2, 0, 3.2, 0, TAU); c.fillStyle = flick; c.fill();
    c.restore();

    // aim laser (fades fast when you fire — sells the cost)
    const sinceShot = s.time - p.lastShot;
    const laserA = Math.max(0, 1 - sinceShot * 2.4) * 0.5;
    if (laserA > 0.01) {
      c.save();
      c.globalAlpha = laserA;
      c.strokeStyle = hexA(main, 0.6);
      c.lineWidth = 1;
      c.setLineDash([6, 10]);
      c.beginPath();
      c.moveTo(p.x + Math.cos(p.aim) * 26, p.y + Math.sin(p.aim) * 26);
      c.lineTo(p.x + Math.cos(p.aim) * 900, p.y + Math.sin(p.aim) * 900);
      c.stroke();
      c.restore();
    }
  }

  drawParticles(s) {
    const c = this.ctx;
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const q of s.particles) {
      const a = Math.max(0, q.life / q.max);
      c.globalAlpha = a;
      c.fillStyle = q.color;
      c.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    c.restore();

    c.save();
    c.font = '700 16px ui-monospace, Menlo, monospace';
    c.textAlign = 'center';
    for (const f of s.floaters) {
      c.globalAlpha = Math.min(1, f.life / 0.4);
      c.font = `700 ${f.size}px ui-monospace, Menlo, monospace`;
      c.fillStyle = f.color;
      c.shadowColor = f.color;
      c.shadowBlur = 12;
      c.fillText(f.text, f.x, f.y);
    }
    c.restore();
  }

  // Honest label whenever the attract-mode bot is driving.
  drawAttractTag(s) {
    if (!s.hermes) return;
    const c = this.ctx;
    c.save();
    c.font = '700 11px ui-monospace, Menlo, monospace';
    c.textAlign = 'left';
    c.fillStyle = 'rgba(255,209,102,0.9)';
    c.fillText('ATTRACT MODE', 34, 112);
    c.fillStyle = 'rgba(255,209,102,0.45)';
    c.fillText('bot is playing — click to take over', 34, 128);
    c.restore();
  }

  drawHUD(s) {
    const c = this.ctx;
    const W = this.uiW, H = this.uiH;
    const p = s.player;
    const over = p.hp <= 0;
    // phones: respect the notch/home bar and shrink the chrome
    const mob = this.mobile;
    const topPad = mob ? 54 : 0;
    const botPad = mob ? 26 : 0;
    const uiK = mob ? 0.72 : 1;
    // desktop: sit just inside the arena box; phone: inside the screen safely
    const padL = mob ? 0 : this.ox;
    const padR = mob ? 0 : (this.uiW - this.ox - W * this.scale) * 0 + (this.uiW - (this.ox + W * this.scale));

    // top-left: score
    c.save();
    c.font = '700 13px ui-monospace, Menlo, monospace';
    c.fillStyle = 'rgba(160,190,215,0.55)';
    c.textAlign = 'left';
    c.fillText('SCORE', 24 + padL, 26 + topPad);
    c.font = `700 ${Math.round(30 * uiK)}px ui-monospace, Menlo, monospace`;
    c.fillStyle = '#dff6ff';
    c.shadowColor = 'rgba(110,245,255,0.5)';
    c.shadowBlur = 14;
    c.fillText(String(s.score).padStart(6, '0'), 22 + padL, 22 + topPad + 30 * uiK);
    c.restore();

    // top-right: wave + kills
    c.save();
    c.textAlign = 'right';
    c.font = '700 13px ui-monospace, Menlo, monospace';
    c.fillStyle = 'rgba(160,190,215,0.55)';
    c.fillText('WAVE', W - 24 - padR, 26 + topPad);
    c.font = `700 ${Math.round(30 * uiK)}px ui-monospace, Menlo, monospace`;
    c.fillStyle = over ? '#ff5f6d' : '#dff6ff';
    c.fillText(String(s.wave).padStart(2, '0'), W - 22 - padR, 22 + topPad + 30 * uiK);
    c.font = '700 12px ui-monospace, Menlo, monospace';
    c.fillStyle = 'rgba(160,190,215,0.5)';
    c.fillText(`${s.kills} KILLS · ${Math.round(s.shotsFired ? (s.shotsHit / s.shotsFired) * 100 : 0)}% ACC`, W - 24 - padR, 18 + topPad + 30 * uiK + 18);
    c.restore();

    // wave timer bar
    const bw = 220;
    c.save();
    c.fillStyle = 'rgba(255,255,255,0.07)';
    c.fillRect(W / 2 - bw / 2, 18 + topPad, bw, 3);
    c.fillStyle = over ? '#ff5f6d' : 'rgba(110,245,255,0.7)';
    c.fillRect(W / 2 - bw / 2, 18 + topPad, bw * Math.min(1, s.waveT / s.waveLen), 3);
    c.restore();

    // streak
    if (s.streak >= 3) {
      c.save();
      c.textAlign = 'center';
      c.font = '700 20px ui-monospace, Menlo, monospace';
      const a = Math.min(1, s.streakT / 2.6);
      c.globalAlpha = a;
      c.fillStyle = '#ffd166';
      c.shadowColor = '#ffd166';
      c.shadowBlur = 16;
      c.fillText(`x${s.streak} STREAK`, W / 2, 52 + topPad);
      c.restore();
    }

    // ---- PULSE bar ----
    const total = p.maxHp;
    const negCount = Math.abs(OVERDRAFT_FLOOR);
    const full = total + negCount;
    const maxBar = W - (mob ? 96 : 160);
    let segW = mob ? 22 : 30;
    const gap = mob ? 3 : 5;
    if (full * segW + (full - 1) * gap > maxBar) segW = Math.max(7, (maxBar - (full - 1) * gap) / full);
    const barW = full * segW + (full - 1) * gap;
    const bx = W / 2 - barW / 2;
    const by = H - (mob ? 46 + botPad : 62);
    const segH = mob ? 16 : 20;

    c.save();
    c.font = '700 11px ui-monospace, Menlo, monospace';
    c.textAlign = 'left';
    c.fillStyle = over ? '#ff5f6d' : 'rgba(160,190,215,0.6)';
    const hpShown = Math.max(OVERDRAFT_FLOOR, Math.min(p.maxHp, p.hp));
    c.fillText(over ? `OVERDRAFT ${hpShown.toFixed(0)}` : `PULSE ${Math.floor(hpShown)}/${p.maxHp}`, bx, by - 9);
    if (over) {
      const blink = Math.sin(this.t * 12) > 0;
      c.textAlign = 'right';
      c.fillStyle = blink ? '#ff2d55' : 'rgba(255,45,85,0.35)';
      c.fillText('KILL TO REPAY', bx + barW, by - 10);
    }
    c.restore();

    for (let i = 0; i < full; i++) {
      const x = bx + i * (segW + gap);
      const isNeg = i >= total;
      const idx = i; // 0..total-1 positive, then negative credit
      // value represented: positive segments from left fill by hp; negative ones by |hp|
      let filled;
      if (!isNeg) filled = p.hp >= idx + 1 ? 1 : p.hp > idx ? p.hp - idx : 0;
      else {
        const negIdx = OVERDRAFT_FLOOR + (i - total); // -3,-2,-1
        filled = p.hp <= negIdx + 1 && p.hp > negIdx ? Math.min(1, negIdx + 1 - p.hp) : p.hp <= negIdx ? 1 : 0;
      }
      c.save();
      if (isNeg) {
        c.strokeStyle = p.hp <= 0 ? 'rgba(255,45,85,0.9)' : 'rgba(255,45,85,0.30)';
        c.lineWidth = 1.5;
        c.strokeRect(x + 0.5, by + 0.5, segW, segH);
        if (filled > 0) {
          c.fillStyle = 'rgba(255,45,85,0.85)';
          c.fillRect(x, by, segW * filled, segH);
        }
      } else {
        c.fillStyle = 'rgba(110,245,255,0.10)';
        c.fillRect(x, by, segW, segH);
        if (filled > 0) {
          const low = p.hp <= 2;
          const col = low ? '#ff3b5c' : '#6ff5ff';
          c.fillStyle = col;
          c.shadowColor = col;
          c.shadowBlur = 16;
          c.fillRect(x, by, segW * filled, segH);
        }
      }
      c.restore();
    }

    // dash cooldown pip
    c.save();
    const ready = p.dashCd <= 0;
    c.globalAlpha = ready ? 1 : 0.35;
    c.strokeStyle = ready ? '#9ffcff' : 'rgba(160,190,215,0.6)';
    c.lineWidth = 2;
    const dx = Math.min(W - 26, W / 2 + barW / 2 + 34), dy = by + (mob ? 8 : 10);
    c.beginPath(); c.arc(dx, dy, 8, 0, TAU); c.stroke();
    if (!ready) {
      c.beginPath();
      c.arc(dx, dy, 8, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - p.dashCd / s.mods.dashCd));
      c.stroke();
    } else {
      c.beginPath(); c.moveTo(dx - 4, dy - 5); c.lineTo(dx + 5, dy); c.lineTo(dx - 4, dy + 5); c.closePath(); c.stroke();
    }
    c.restore();

    // desktop: tappable pause + mode badge (no touch buttons on PC)
    if (!mob) {
      const px = W - 30, py = 30, pr = 15;
      this._deskPause = { x: px, y: py, r: pr };
      c.save();
      c.globalAlpha = 0.7;
      c.strokeStyle = '#9ffcff'; c.lineWidth = 2;
      c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.stroke();
      c.fillStyle = '#9ffcff';
      const bw2 = 3.2, bh2 = 12;
      c.fillRect(px - bw2 * 2.2, py - bh2 / 2, bw2, bh2);
      c.fillRect(px + bw2 * 1.2, py - bh2 / 2, bw2, bh2);
      c.restore();

      // mode badge, clickable
      const auto = s.fireMode === 'auto';
      const label = auto ? 'TURRET · TAB' : 'MARKSMAN · TAB';
      c.save();
      c.font = '700 11px ui-monospace, Menlo, monospace';
      const tw = c.measureText(label).width + 20;
      const bx = W - 30 - pr * 2 - 12 - tw, by = 18;
      this._deskMode = { x: bx, y: by, w: tw, h: 24 };
      c.globalAlpha = 0.9;
      c.fillStyle = auto ? 'rgba(125,255,178,0.14)' : 'rgba(255,209,102,0.14)';
      c.strokeStyle = auto ? '#7dffb2' : '#ffd166';
      c.lineWidth = 1.5;
      roundRect(c, bx, by, tw, 24, 12);
      c.fill(); c.stroke();
      c.fillStyle = auto ? '#c8ffdc' : '#ffe9b8';
      c.textAlign = 'center';
      c.fillText(label, bx + tw / 2, by + 16);
      c.restore();
    }

    // low-health vignette + heartbeat text
    if (p.hp <= 1.2 && !over) {
      c.save();
      c.globalAlpha = 0.5 + Math.sin(this.t * 7) * 0.2;
      c.font = '700 13px ui-monospace, Menlo, monospace';
      c.textAlign = 'center';
      c.fillStyle = '#ff3b5c';
      c.fillText(mob ? 'CRITICAL — STOP FIRING' : 'PULSE CRITICAL — STOP FIRING TO REGEN', W / 2, by - 26);
      c.restore();
    }
  }

  // ------------------------------------------------------------------
  // TOUCH LAYOUT — the single source of truth for both drawing and
  // hit-testing, so a button can never be drawn somewhere it isn't tappable.
  // Anchored to the real screen corners, scaled off the short edge, so the
  // controls use the whole square instead of fixed pixel offsets.
  // ------------------------------------------------------------------
  controlLayout() {
    const W = this.worldW, H = this.worldH;
    const short = Math.min(W, H);
    const R = Math.max(46, Math.min(short * 0.115, 96));   // button radius
    const pad = Math.max(18, short * 0.045);               // screen-edge padding
    const gap = R * 0.34;

    const stick = { x: pad + R, y: H - pad - R, r: R };
    const dash  = { x: pad + R, y: H - pad - R * 2 - gap - R, r: R * 0.78 };
    const fire  = { x: W - pad - R, y: H - pad - R, r: R * 1.06 };
    const mode  = { x: W - pad - R, y: H - pad - R * 2 - gap - R * 0.9, r: R * 0.62 };
    const pause = { x: W - pad - R * 0.5, y: pad + R * 0.5, r: R * 0.46 };
    const gyro  = { x: pad + R * 0.5, y: pad + R * 0.5, r: R * 0.46 };

    return { R, pad, stick, dash, fire, mode, pause, gyro, W, H };
  }

  // generous hit radius: +14px of slop so thumbs forgive
  hit(cx, cy, btn) {
    if (!btn) return false;
    return (cx - btn.x) ** 2 + (cy - btn.y) ** 2 < (btn.r + 14) ** 2;
  }

  drawTouchControls(s, input) {
    if (!this.mobile) return;
    const c = this.ctx;
    const L = this.controlLayout();
    const auto = s.fireMode === 'auto';
    const hostile = s.player.hp <= 0;

    // ---------- movement stick (bottom-left) ----------
    c.save();
    c.globalAlpha = 0.5;
    c.strokeStyle = 'rgba(110,245,255,0.55)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.stick.x, L.stick.y, L.stick.r, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = 0.10;
    c.fillStyle = '#6ff5ff';
    c.beginPath(); c.arc(L.stick.x, L.stick.y, L.stick.r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.8;
    const kx = L.stick.x + (input.ax || 0) * L.stick.r * 0.6;
    const ky = L.stick.y + (input.ay || 0) * L.stick.r * 0.6;
    c.fillStyle = 'rgba(110,245,255,0.9)';
    c.beginPath(); c.arc(kx, ky, L.stick.r * 0.32, 0, Math.PI * 2); c.fill();
    c.restore();

    // ---------- A: fire / shoot ----------
    c.save();
    const aOn = input.fire || auto;
    c.globalAlpha = aOn ? 0.95 : 0.6;
    c.strokeStyle = hostile ? 'rgba(255,59,92,0.9)' : (auto ? '#7dffb2' : '#ffd166');
    c.lineWidth = 3;
    c.beginPath(); c.arc(L.fire.x, L.fire.y, L.fire.r, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = aOn ? 0.30 : 0.12;
    c.fillStyle = hostile ? '#ff3b5c' : (auto ? '#7dffb2' : '#ffd166');
    c.beginPath(); c.arc(L.fire.x, L.fire.y, L.fire.r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.95;
    c.fillStyle = auto ? '#c8ffdc' : '#ffe9b8';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.fire.r * 0.62)}px ui-monospace, Menlo, monospace`;
    c.fillText('A', L.fire.x, L.fire.y + L.fire.r * 0.22);
    c.globalAlpha = 0.55;
    c.font = `700 ${Math.round(L.fire.r * 0.22)}px ui-monospace, Menlo, monospace`;
    c.fillText(auto ? 'AUTO' : 'FIRE', L.fire.x, L.fire.y + L.fire.r * 0.72);
    // charge ring = how many shots the budget allows
    const afford = Math.max(0, Math.floor(s.player.hp - 3));
    c.globalAlpha = 0.85;
    c.strokeStyle = hostile ? '#ff3b5c' : (auto ? '#7dffb2' : '#6ff5ff');
    c.lineWidth = 3.5;
    c.beginPath();
    c.arc(L.fire.x, L.fire.y, L.fire.r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, afford / 8));
    c.stroke();
    c.restore();

    // ---------- B: dash ----------
    const ready = s.player.dashCd <= 0;
    c.save();
    c.globalAlpha = ready ? 0.85 : 0.32;
    c.strokeStyle = '#9ffcff';
    c.lineWidth = 3;
    c.beginPath(); c.arc(L.dash.x, L.dash.y, L.dash.r, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = ready ? 0.16 : 0.05;
    c.fillStyle = '#9ffcff';
    c.beginPath(); c.arc(L.dash.x, L.dash.y, L.dash.r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.95;
    c.fillStyle = '#d8feff';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.dash.r * 0.62)}px ui-monospace, Menlo, monospace`;
    c.fillText('B', L.dash.x, L.dash.y + L.dash.r * 0.22);
    c.globalAlpha = 0.55;
    c.font = `700 ${Math.round(L.dash.r * 0.22)}px ui-monospace, Menlo, monospace`;
    c.fillText('DASH', L.dash.x, L.dash.y + L.dash.r * 0.72);
    c.restore();

    // ---------- mode toggle (top-right of the fire stack) ----------
    c.save();
    c.globalAlpha = 0.9;
    c.strokeStyle = auto ? '#7dffb2' : '#ffd166';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.mode.x, L.mode.y, L.mode.r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = auto ? '#7dffb2' : '#ffd166';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.mode.r * 0.5)}px ui-monospace, Menlo, monospace`;
    c.fillText(auto ? 'AUTO' : 'AIM', L.mode.x, L.mode.y + L.mode.r * 0.18);
    c.restore();

    // ---------- pause (top-right corner) ----------
    c.save();
    c.globalAlpha = 0.75;
    c.strokeStyle = '#9ffcff';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.pause.x, L.pause.y, L.pause.r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = '#9ffcff';
    const bw = L.pause.r * 0.22, bh = L.pause.r * 0.7;
    c.fillRect(L.pause.x - bw * 1.6, L.pause.y - bh / 2, bw, bh);
    c.fillRect(L.pause.x + bw * 0.6, L.pause.y - bh / 2, bw, bh);
    c.restore();

    // ---------- gyro toggle (top-left corner) ----------
    c.save();
    c.globalAlpha = this.gyroOn ? 0.95 : 0.55;
    c.strokeStyle = this.gyroOn ? '#7dffb2' : 'rgba(160,190,215,0.8)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(L.gyro.x, L.gyro.y, L.gyro.r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = this.gyroOn ? '#7dffb2' : '#9fb6cf';
    c.textAlign = 'center';
    c.font = `800 ${Math.round(L.gyro.r * 0.55)}px ui-monospace, Menlo, monospace`;
    c.fillText('GYRO', L.gyro.x, L.gyro.y + L.gyro.r * 0.18);
    c.restore();
  }

  // First-run instructions. Shown over the title screen and dismissed by the first
  // real input, so it never blocks anyone. On a phone the copy talks about A/B and
  // tilting; on a PC it talks about mouse and keys. Same overlay, right language.
  drawInstructions(s, alpha) {
    if (alpha <= 0) return;
    const c = this.ctx;
    const W = this.worldW, H = this.worldH;
    const mob = this.mobile;
    c.save();
    c.globalAlpha = alpha;

    const pad = mob ? 18 : 40;
    const panelW = Math.min(W - pad * 2, mob ? 340 : 520);
    const lines = mob
      ? [
          ['HOW TO PLAY', ''],
          ['LEFT THUMB', 'move'],
          ['RIGHT THUMB', 'drag anywhere to aim'],
          ['A', 'fire'],
          ['B', 'dash'],
          ['GYRO', 'tilt to move (top-left)'],
          ['', ''],
          ['YOUR HP IS YOUR AMMO', ''],
          ['Every shot costs 1 PULSE', ''],
          ['Every kill pays it back', ''],
          ['Miss and the bullet bounces back at you', ''],
          ['', ''],
          ['TAP ANYWHERE TO BEGIN', ''],
        ]
      : [
          ['HOW TO PLAY', ''],
          ['W A S D', 'move'],
          ['MOUSE', 'aim'],
          ['LEFT CLICK / SPACE', 'fire'],
          ['SHIFT', 'dash'],
          ['P', 'pause'],
          ['TAB', 'switch mode'],
          ['', ''],
          ['YOUR HP IS YOUR AMMO', ''],
          ['Every shot costs 1 PULSE', ''],
          ['Every kill pays it back', ''],
          ['Miss and the bullet bounces back at you', ''],
          ['', ''],
          ['CLICK ANYWHERE TO BEGIN', ''],
        ];

    const rowH = mob ? 19 : 22;
    const panelH = lines.length * rowH + (mob ? 30 : 38);
    const x = W / 2 - panelW / 2;
    const y = H / 2 - panelH / 2;

    // dim the arena behind it

    this.master = null;

    this._drone = null;

  ensure() {

  toggleMute() {
    this.muted = !this.muted;

    return this.muted;

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    node.connect(g);
    g.connect(this.master);
    return g;

    src.buffer = this.noise;
    src.playbackRate.value = 1;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = q;
    src.connect(bp);
    this._env(bp, t0, 0.002, dur, peak);
    src.start(t0, Math.random() * 0.5, dur + 0.05);

    o.type = type;
    o.frequency.setValueAtTime(f0, t0);

      state.fireMode = chosenMode;
      mouse.x = state.player.x; mouse.y = state.player.y - 120;
      input.aimX = mouse.x; input.aimY = mouse.y;
    }
  }
  if (['1', '2', '3'].includes(k) && state.mode === 'pick') {
    chooseCard(state, Number(k) - 1);
  }
  if (k === 'shift') input.dash = true;
  if (k === ' ' && state.mode === 'play') input.dash = true;
});
window.addEventListener('keyup', (e) => {
  keys.delete(e.key.toLowerCase());
  if (e.key.toLowerCase() === 'shift' || e.key === ' ') input.dash = false;
});
window.addEventListener('blur', () => { keys.clear(); input.fire = false; });

// ---------------------------------------------------------------------------
// pointer: mouse aim + fire, touch sticks
// ---------------------------------------------------------------------------
let mouse = { x: W / 2, y: H / 2 - 100, down: false, active: false };
let isTouch = false;

const touches = new Map(); // pointerId -> { kind:'move'|'aim', ox, oy, x, y }
let moveStick = null;

canvas.addEventListener('pointerdown', (e) => {
  sfx.ensure();
  dismissHelp();
  canvas.setPointerCapture?.(e.pointerId);
  // Real touch input is the only reliable signal that this is a touch device.
  // A touchscreen laptop reports 'pointer: coarse'; a phone with a Bluetooth
  // mouse reports fine. Listen to the hand actually in use instead of guessing.
  if (e.pointerType === 'touch') {
    isTouch = true;
    if (!renderer.mobile) renderer.mobile = true;
  }

  if (state.mode === 'title') {
    // hit-test the two mode chips first, so picking a mode doesn't start the run
    const ui = renderer.toUI(e.clientX, e.clientY);
    const chips = renderer._modeChips;
    if (chips && ui.y >= chips.y - 8 && ui.y <= chips.y + chips.h + 8) {
      for (let i = 0; i < 2; i++) {
        const x = chips.x + i * (chips.w + chips.gap);
        if (ui.x >= x && ui.x <= x + chips.w) {
          setFireMode(i === 0 ? 'manual' : 'auto');
          return;
        }
      }
    }
    clearInputState();
    startRun(state);
    state.fireMode = chosenMode;
    // touch players tap once to begin; PC players hold to fire from the first frame
    if (e.pointerType !== 'touch') { mouse.down = true; mouse.active = true; input.fire = true; }
    return;
  }
  if (state.mode === 'dead') {
    clearInputState();
    startRun(state);
    state.fireMode = chosenMode;
    // touch players tap once to begin; PC players hold to fire from the first frame
    if (e.pointerType !== 'touch') { mouse.down = true; mouse.active = true; input.fire = true; }
    return;
  }
  if (state.mode === 'pick') {
    const ui = renderer.toUI(e.clientX, e.clientY);
    const idx = cardIndexAt(ui.x, ui.y, state);
    if (idx >= 0) chooseCard(state, idx);
    return;
  }

  if (e.pointerType === 'touch') {
    const w = renderer.toWorld(e.clientX, e.clientY);
    const L = renderer.controlLayout();

    // top corner buttons first: they overlap nothing else
    if (renderer.hit(w.x, w.y, L.pause)) { paused = !paused; return; }
    if (renderer.hit(w.x, w.y, L.gyro)) {
      if (gyro.on) { disableGyro(); renderer.gyroOn = false; }
      else enableGyro().then((ok) => { renderer.gyroOn = ok; });
      return;
    }
    if (renderer.hit(w.x, w.y, L.mode)) { toggleFireMode(); return; }
    if (renderer.hit(w.x, w.y, L.dash)) { input.dash = true; return; }

    // A button = fire. In AUTO it only records a tap; the turret fires anyway.
    if (renderer.hit(w.x, w.y, L.fire)) {
      const t = { kind: 'fire', ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now() };
      touches.set(e.pointerId, t);
      input.fire = true;
      return;
    }

    // right side but outside the A button = aim (MANUAL only)
    if (w.x > L.W * 0.5 && state.fireMode === 'manual') {
      const t = { kind: 'aim', ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now() };
      touches.set(e.pointerId, t);
      input.aimX = w.x; input.aimY = w.y;
      input.fire = true;
      return;
    }

    // left side = movement stick
    const t = { kind: 'move', ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now() };
    touches.set(e.pointerId, t);
    moveStick = t;
    return;
  } else {
    // desktop chrome: pause circle and mode badge are clickable
    const ui = renderer.toUI(e.clientX, e.clientY);
    const dp = renderer._deskPause;
    if (dp && (ui.x - dp.x) ** 2 + (ui.y - dp.y) ** 2 < (dp.r + 8) ** 2) { paused = !paused; return; }
    const dm = renderer._deskMode;
    if (dm && ui.x >= dm.x && ui.x <= dm.x + dm.w && ui.y >= dm.y && ui.y <= dm.y + dm.h) {
      toggleFireMode(); return;
    }
    mouse.down = true;
    mouse.active = true;
    input.fire = true;
    if (state.wantLock && state.mode === 'play' && document.pointerLockElement !== canvas) {
      canvas.requestPointerLock?.();
      state.wantLock = false;
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') {
    const t = touches.get(e.pointerId);
    if (!t) return;
    t.x = e.clientX; t.y = e.clientY;
    if (t.kind === 'move') {
      const dx = t.x - t.ox, dy = t.y - t.oy;
      const max = 62;
      const m = Math.hypot(dx, dy);
      const s = m > max ? max / m : 1;
      const nx = dx * s, ny = dy * s;
      input.ax = m < 10 ? 0 : nx / max;
      input.ay = m < 10 ? 0 : ny / max;
    } else if (t.kind === 'aim') {
      const w = renderer.toWorld(e.clientX, e.clientY);
      input.aimX = w.x; input.aimY = w.y;
      input.fire = true;
    }
    return;
  }
  // a real mouse means real mouse chrome
  if (e.pointerType === 'mouse' && renderer.mobile && !('ontouchstart' in window && isTouch === false)) {
    // only demote if no touch has ever happened this session
    if (!isTouch) renderer.mobile = false;
  }
  // mouse
  const w = renderer.toWorld(e.clientX, e.clientY);
  mouse.x = w.x; mouse.y = w.y;
  mouse.active = true;
  if (state.mode === 'pick') {
    const ui = renderer.toUI(e.clientX, e.clientY);
    state.hoverCard = cardIndexAt(ui.x, ui.y, state);
    canvas.style.cursor = state.hoverCard >= 0 ? 'pointer' : 'default';
  } else {
    canvas.style.cursor = 'crosshair';
  }
});

function endPointer(e) {
  if (e.pointerType === 'touch') {
    const t = touches.get(e.pointerId);
    touches.delete(e.pointerId);
    if (t && t.kind === 'move') {
      moveStick = null;
      input.ax = 0; input.ay = 0;
      // double-tap-ish quick tap on the stick = dash
      if (performance.now() - t.t0 < 130 && Math.hypot(t.x - t.ox, t.y - t.oy) < 14) input.dash = true;
    }
    if (t && (t.kind === 'aim' || t.kind === 'fire')) {
      const stillHeld = [...touches.values()].some((q) => q.kind === 'aim' || q.kind === 'fire');
      if (!stillHeld) input.fire = false;
    }
  } else {
    mouse.down = false;
    input.fire = false;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// Mouse aim works two ways: locked (relative movement, ideal for a shooter) and
// free (absolute position, used before the first click and on the menus).
document.addEventListener('pointerlockchange', () => {
  state.locked = document.pointerLockElement === canvas;
  canvas.style.cursor = state.locked ? 'none' : 'crosshair';
});

document.addEventListener('mousemove', (e) => {
  if (!state.locked) return;
  // relative -> world deltas, scaled the same way the arena is scaled
  const k = 1 / renderer.scale;
  mouse.x = Math.max(0, Math.min(renderer.worldW, mouse.x + e.movementX * k));
  mouse.y = Math.max(0, Math.min(renderer.worldH, mouse.y + e.movementY * k));
  input.aimX = mouse.x;
  input.aimY = mouse.y;
});

// ---------------------------------------------------------------------------
// fire modes
// ---------------------------------------------------------------------------
// A run must always begin with a clean slate: no held key, no half-held trigger.
// Without this, any key still down at the moment of restart keeps acting on the
// new run (this is what burned ammo on restart).
function clearInputState() {
  keys.clear();
  input.fire = false;
  input.dash = false;
  input.ax = 0;
  input.ay = 0;
  mouse.down = false;
}

function toggleFireMode() {
  const next = state.fireMode === 'auto' ? 'manual' : 'auto';
  setFireMode(next);
}

let chosenMode = 'auto';
function setFireMode(mode) {
  chosenMode = mode;
  state.fireMode = mode;
  const m = mode === 'auto' ? 'TURRET · AUTO-FIRE' : 'MARKSMAN · YOU AIM';
  toast(m);
  renderer.modeFlash = 1;
}

// ---------------------------------------------------------------------------
// gyroscope: tilt the phone to steer (opt-in, needs a user gesture on iOS)
// ---------------------------------------------------------------------------
const gyro = { on: false, x: 0, y: 0, base: null, supported: false, asked: false };

gyro.supported = typeof window !== 'undefined' && 'DeviceOrientationEvent' in window;

function onOrientation(e) {
  if (!gyro.on) return;
  // beta = front/back tilt, gamma = left/right tilt, in degrees
  const beta = e.beta || 0;
  const gamma = e.gamma || 0;
  if (!gyro.base) gyro.base = { beta, gamma };
  // 22 degrees of tilt = full speed; inverted so tilting away moves up
  const nx = Math.max(-1, Math.min(1, (gamma - gyro.base.gamma) / 22));
  const ny = Math.max(-1, Math.min(1, (beta - gyro.base.beta) / 22));
  gyro.x = nx; gyro.y = ny;
}

async function enableGyro() {
  if (!gyro.supported) { toast('NO GYROSCOPE'); return false; }
  try {
    // iOS 13+ requires an explicit permission prompt from a gesture
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { toast('GYRO DENIED'); return false; }
    }
    window.addEventListener('deviceorientation', onOrientation);
    gyro.on = true;
    gyro.base = null;
    toast('GYRO ON · TILT TO MOVE');
    return true;
  } catch (err) {
    toast('GYRO UNAVAILABLE');
    return false;
  }
}

function disableGyro() {
  window.removeEventListener('deviceorientation', onOrientation);
  gyro.on = false; gyro.x = 0; gyro.y = 0; gyro.base = null;
}

// ---------------------------------------------------------------------------
// card hit testing
// ---------------------------------------------------------------------------
// Controls are DRAWN in world space (renderer translates+scales before drawing),
// so they must be HIT-TESTED in world space too. On a phone world == screen so it
// looked fine, but on any device where they diverge the tappable area is offset.
function touchPoint(e) {
  return renderer.toWorld(e.clientX, e.clientY);
}

function cardIndexAt(wx, wy, s) {
  const cards = s.pick || [];
  const mob = renderer.mobile;
  const W = renderer.uiW, H = renderer.uiH;
  const cw = mob ? Math.min(W - 56, 320) : 260;
  const chh = mob ? 132 : 190;
  const gap = mob ? 14 : 30;
  const totalW = mob ? cw : cards.length * cw + (cards.length - 1) * gap;
  const startX = W / 2 - totalW / 2;
  const y = mob ? H * 0.3 : 300;
  for (let i = 0; i < cards.length; i++) {
    const x = mob ? startX : startX + i * (cw + gap);
    const yy = y + (mob ? i * (chh + gap) : 0);
    if (wx >= x && wx <= x + cw && wy >= yy - 8 && wy <= yy + chh) return i;
  }
  return -1;
}

// ---------------------------------------------------------------------------
// demo bot (attract mode) — plays competently so you can record instantly.
// ---------------------------------------------------------------------------
function demoInput(s) {
  const p = s.player;
  let best = null, bd = Infinity;
  for (const e of s.enemies) {
    if (e.dead) continue;
    const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }
  const out = { ax: 0, ay: 0, aimX: p.x, aimY: p.y - 100, fire: false, dash: false };
  if (!best) {
    out.aimX = p.x + Math.cos(s.time) * 100;
    out.aimY = p.y + Math.sin(s.time) * 100;
    return out;
  }
  const d = Math.sqrt(bd) || 1;
  const ux = (best.x - p.x) / d, uy = (best.y - p.y) / d;

  // lead the target, then add a little hand-shake so the footage looks human
  const lead = 0.09;
  let tx = best.x + best.vx * lead;
  let ty = best.y + best.vy * lead;
  const shake = Math.sin(s.time * 5.1) * 9 + Math.sin(s.time * 13.7) * 4;
  const perp = Math.atan2(ty - p.y, tx - p.x) + Math.PI / 2;
  tx += Math.cos(perp) * shake;
  ty += Math.sin(perp) * shake;
  out.aimX = tx; out.aimY = ty;

  // keep distance, and strafe so it reads as deliberate play
  const want = 265 * (s.es || 1);
  const radial = d < want - 70 ? -1 : d > want + 70 ? 1 : 0;
  const strafe = p.hp < 2.5 ? 0.9 : 0.55;
  out.ax = ux * radial + -uy * strafe * Math.sign(Math.sin(s.time * 0.9) || 1);
  out.ay = uy * radial + ux * strafe * Math.sign(Math.sin(s.time * 0.9) || 1);

  // hold fire when the pulse is low and nothing is close: let the economy breathe
  const aligned = Math.abs(Math.atan2(out.aimY - p.y, out.aimX - p.x) - p.aim) < 0.20;
  const desperate = p.hp <= 2.5;
  const commit = !desperate || d < 190 * (s.es || 1) || p.hp <= 0;
  out.fire = d < 560 * (s.es || 1) && aligned && commit && p.hp > 0.5;

  if (d < 130 * (s.es || 1) && p.dashCd <= 0) out.dash = true;
  // stay inside the tightest crop (portrait phones) so the demo always reads on camera
  const ww = s.world.w, wh = s.world.h;
  const margin = Math.min(250, ww * 0.22);
  if (p.x < margin) out.ax += 0.9;
  if (p.x > ww - margin) out.ax -= 0.9;
  if (p.y < Math.min(210, wh * 0.2)) out.ay += 0.9;
  if (p.y > wh - Math.min(210, wh * 0.2)) out.ay -= 0.9;
  // small deadzone so it doesn't jitter like a machine
  const m = Math.hypot(out.ax, out.ay);
  if (m > 0 && m < 0.18) { out.ax = 0; out.ay = 0; }
  return out;
}

// ---------------------------------------------------------------------------
// loop
// ---------------------------------------------------------------------------
let last = performance.now();
let acc = 0;
const FIXED = 1 / 60;
let fpsT = 0, frames = 0;

function frame(now) {
  const rawDt = (now - last) / 1000;
  last = now;
  const dt = Math.min(0.05, rawDt);
  acc += dt;

  // gather keyboard into input
  if (!isTouch) {
    const kbx = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
    const kby = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
    if (kbx || kby) { input.ax = kbx; input.ay = kby; }
    else if (!touches.size) { input.ax = 0; input.ay = 0; }
    // gyro takes over when the stick is idle, so both can coexist
    if (gyro.on && !touches.size && !kbx && !kby) {
      input.ax = gyro.x; input.ay = gyro.y;
    }
    if (mouse.active) { input.aimX = mouse.x; input.aimY = mouse.y; }
    // MANUAL: hold left mouse OR space OR J. AUTO: the turret fires itself, so
    // the player never has to click to shoot (this was the 'press Esc to shoot' bug:
    // every click was being eaten by a pointer-lock request).
    const wantFire = mouse.down || keys.has(' ') || keys.has('j');
    if (wantFire) input.fire = true;
    input.dash = input.dash || keys.has('shift') || (keys.has(' ') && state.mode === 'play');
  }

  // a real pause: stop accumulating time so the sim cannot advance at all
  if (paused) { acc = 0; renderer.draw(state, mouse, dt); drawPause(); requestAnimationFrame(frame); return; }

  while (acc >= FIXED) {
    let stepInput = input;
    if (DEMO && state.mode === 'play') stepInput = demoInput(state);
    step(state, FIXED, stepInput);
    acc -= FIXED;
    input.dash = false;
    handleEvents();
  }

  if (state.mode === 'dead') state.deadT += dt;

  // respect the OS "reduce motion" setting: halve shake, keep the game readable
  if (REDUCE_MOTION && state.shake > 6) state.shake = 6;
  renderer.draw(state, mouse, dt);
  if (state.mode === 'play' && renderer.mobile) {
    renderer.ctx.save();
    renderer.ctx.translate(renderer.ox, renderer.oy);
    renderer.ctx.scale(renderer.scale, renderer.scale);
    renderer.drawTouchControls(state, input);
    renderer.ctx.restore();
  }
  if (!helpDismissed && helpAlpha > 0) helpAlpha = Math.max(1.6, helpAlpha - dt * 0.55);
  if (!helpDismissed && helpAlpha > 0) {
    renderer.ctx.save();
    renderer.ctx.translate(renderer.ox, renderer.oy);
    renderer.ctx.scale(renderer.scale, renderer.scale);
    // gentle fade: full for a moment, then out
    const a = Math.min(1, Math.max(0, helpAlpha / 1.6));
    renderer.drawInstructions(state, a);
    renderer.ctx.restore();
  }
  if (paused) drawPause();

  // fps badge (dev only via ?debug=1)
  frames++; fpsT += dt;
  if (params.get('debug') === '1' && fpsT > 0.5) {
    const c = renderer.ctx;
    c.save();
    c.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
    c.font = '11px monospace';
    c.fillStyle = '#4ade80';
    c.fillText(`${Math.round(frames / fpsT)} fps · ${state.enemies.length} ent`, 8, 14);
    c.restore();
    frames = 0; fpsT = 0;
  }

  requestAnimationFrame(frame);
}

let overdraftOn = false;
function handleEvents() {
  const over = state.player.hp <= 0 && state.mode !== 'title';
  if (over && !overdraftOn) { sfx.overdraftOn(); overdraftOn = true; }
  if (!over && overdraftOn) { sfx.overdraftOff(); overdraftOn = false; }

  for (const ev of state.events) {
    switch (ev.type) {
      case 'shoot': sfx.shoot(ev.over, Math.max(0, state.player.hp)); break;
      case 'hit': sfx.hit(); break;
      case 'kill': sfx.kill(); buzz(9); break;
      case 'overdraftKill': sfx.orb(); toast('REPAID'); break;
      case 'hurt': sfx.hurt(); buzz(38); break;
      case 'dash': sfx.dash(); break;
      case 'wave': sfx.wave(); break;
      case 'card': toast(ev.name); break;
    }
  }
  // heartbeat when critical (non-overdraft, low pulse)
  if (state.mode === 'play' && state.player.hp > 0 && state.player.hp <= 1.5) {
    hbT -= FIXED;
    if (hbT <= 0) { sfx.heartbeat(0.7); hbT = 0.75; }
  }
}
let hbT = 0;

// Haptics: only on devices that have them, and never if the player asked for
// reduced motion (which on iOS is the closest proxy for 'don't buzz me').
function buzz(ms) {
  if (!renderer.mobile) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch {} }
}

function drawPause() {
  const c = renderer.ctx;
  c.save();
  c.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
  const w = canvas.width / renderer.dpr, h = canvas.height / renderer.dpr;
  c.fillStyle = 'rgba(4,5,10,0.72)';
  c.fillRect(0, 0, w, h);
  c.fillStyle = '#9ffcff';
  c.font = '800 28px ui-monospace, monospace';
  c.textAlign = 'center';
  c.fillText('PAUSED', w / 2, h / 2);
  c.font = '400 13px ui-monospace, monospace';
  c.fillStyle = 'rgba(160,190,215,0.7)';
  c.fillText('press P to resume', w / 2, h / 2 + 26);
  c.restore();
}

// tiny transient toast
let toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 1.1; }
(function toastLoop() {
  if (toastT > 0) {
    const c = renderer.ctx;
    c.save();
    c.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
    const w = canvas.width / renderer.dpr, h = canvas.height / renderer.dpr;
    c.globalAlpha = Math.min(1, toastT * 2);
    c.font = '700 12px ui-monospace, monospace';
    c.fillStyle = '#ffd166';
    c.textAlign = 'center';
    c.fillText(toastMsg, w / 2, h - 24);
    c.restore();
  }
  requestAnimationFrame(toastLoop);
})();

// resize canvas backing store on orientation change
function syncWorld() {
  renderer.resize();
  sim_setWorld(state, renderer.worldW, renderer.worldH);
  state.aimAssist = renderer.mobile ? 0.34 : 0;
  state.touchUi = !!renderer.mobile;
  const p = state.player;
  p.x = Math.min(p.x, renderer.worldW - 24);
  p.y = Math.min(p.y, renderer.worldH - 24);
}
window.addEventListener('orientationchange', () => setTimeout(syncWorld, 150));
window.addEventListener('resize', () => syncWorld());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => syncWorld());

if (AUTOSTART) { clearInputState(); startRun(state); }
requestAnimationFrame(frame);

// test / automation hooks
window.__OVERDRAFT = {
  state,
  start: () => startRun(state),
  step: (n, inp) => { for (let i = 0; i < n; i++) step(state, 1 / 60, inp || input); },
  renderer,
};

})();
})();
</script>
</body>
</html>
