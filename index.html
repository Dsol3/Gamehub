<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>OVERDRAFT — your health bar is the magazine</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#04050a" />
<!-- iOS ignores manifest orientation, so these are what actually make a
     home-screen icon launch fullscreen and landscape on an iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OVERDRAFT" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<meta name="description" content="OVERDRAFT is a top-down arena shooter where every bullet is paid for with your own health. Kill to earn it back." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060a;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; touch-action: none; outline: none;
    image-rendering: auto;
    max-width: 100%; max-height: 100%;
  }
  /* CRT scanlines + soft edge vignette over the whole stage */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode: multiply;
    opacity: .75;
  }
  #credit {
    position: fixed; bottom: 6px; right: 10px; z-index: 11;
    font-size: 10px; letter-spacing: .12em; color: #3a4152;
    text-transform: uppercase;
  }
  #credit a { color: #4d6b82; text-decoration: none; border-bottom: 1px dotted #2b3542; }
  #credit a:hover { color: #9ffcff; }
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
  <div id="crt"></div>
  <div id="credit">OVERDRAFT · vertical slice · <a href="docs/overdraft-gameplay.mp4">watch the 90s gameplay clip</a></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
